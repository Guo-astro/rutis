[package]
name = "rutis-e2e-fixture-host"
description = "The Rust host of E2E scenario S4 (#188): rutis-host's library, a Rust calendar row, and configuration reloads on a stdin command"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The system under test, not the harness: the harness (tests/e2e) only runs
# this program, as it runs rutis-host (quality standard Q7.6).
[dependencies]
rutis = { path = "../../../crates/rutis" }
rutis-bridge = { path = "../../../crates/rutis-bridge", default-features = false }
rutis-host = { path = "../../../crates/rutis-host" }
rutis-loader = { path = "../../../crates/rutis-loader", default-features = false }
serde_json = "1"
tokio = { workspace = true }
