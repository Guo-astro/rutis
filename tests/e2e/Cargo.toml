[package]
name = "rutis-e2e"
description = "Black-box end-to-end scenarios: real rutis-host processes, project directories, probe plugins, residue checks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Black box (quality standard Q7.6): no rutis crate here, only what a user
# has — the rutis-host program, the packages and the files it reads.
[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Each host in a Job Object (#232); Ctrl-Break to its console group; what
# a process holds (the soak, #192).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
