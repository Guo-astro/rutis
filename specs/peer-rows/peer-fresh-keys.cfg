\* A key per load, as a current `run` row has it: a notice of an old load
\* names a key no row here has, so matching a notice by its key alone does
\* not reach the new generation. Expected: ok (all safety invariants).
CONSTANTS
    Rows = {"a", "b"}
    MaxSessions = 2
    MaxGens = 2
    Faults = {"lose"}
    Failures = TRUE
    SelfEnds = TRUE
    KeyPerLoad = TRUE
    Mutation = "lateEnding"
SPECIFICATION Spec
INVARIANTS
    OneInstanceAtATime
    OwnGenerationOnly
    ServicesFollowRows
    CleanupOnce
CHECK_DEADLOCK FALSE
