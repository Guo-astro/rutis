\* Protocol 5's rule (#1099): the callee acknowledges a cancel it resolves,
\* so the caller's entry goes when the acknowledgement arrives instead of
\* waiting for a reply. A reply written before the cancel was read still
\* arrives first and clears the entry; the ack that follows is ignored. The
\* ack rule comes with "never answer after the acknowledgement"
\* (`call-mut-ack-then-reply` is that mutation).
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "never"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "ack"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelledEntriesDrain
    NoUnknownCall
    SettlesAtMostOnce
    LateReplyDropped
    NoOverRelease
CHECK_DEADLOCK FALSE
