\* The protocol-5 rule broken on purpose: the callee acknowledges the cancel
\* and then still replies (`Replies = "always"`). The caller has already
\* cleared its cancelled entry on the ack, so the reply is an unknown call and
\* ends the session (SESS-41). This is why "acknowledge" and "never reply
\* after the acknowledgement" are one rule.
\* Expected: violated:NoUnknownCall.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "ack"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    NoUnknownCall
CHECK_DEADLOCK FALSE
