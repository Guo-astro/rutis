\* The relay's cancelled tables without acknowledgements (`Acks = FALSE`),
\* the shape before protocol 5: an entry is cleared only by the late reply it
\* is meant for. A forwards a call A cancelled, C still had it queued and
\* drops it without an answer (SESS-57), so both A and M keep their entries
\* until the session closes — the same gap as the caller's own table, one
\* hop further along (#1099, #626 `BoundedTables`). `call-gap-cancel-table`
\* shows the first hop alone.
\* Expected: violated:RelayCancelledEntriesDrain.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "always"
    Acks = FALSE
SPECIFICATION Spec
INVARIANTS
    RelayCancelledEntriesDrain
CHECK_DEADLOCK FALSE
