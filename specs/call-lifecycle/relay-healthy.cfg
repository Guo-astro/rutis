\* A call through the relay, A cancelling it and giving the reference back;
\* both reply rules allowed after a cancel (SESS-61). The cancel reaches C
\* (M passes it on while it still forwards the call), the release reaches C
\* (the relay drops its import), and the grant counts travel the chain
\* without being counted twice.
\* Protocol 5 (#1099): each hop acknowledges the cancel it resolves, so both
\* cancelled tables drain and a conforming callee never answers after an ack.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "never"
    Acks = TRUE
SPECIFICATION Spec
INVARIANTS
    CancelReaches
    RelayReleasesImport
    GrantsConserved
    SettlesAtMostOnce
    LateReplyDropped
    RelayCancelledEntriesDrain
    NoStrayReply
CHECK_DEADLOCK FALSE
