\* The caller's cancelled table before protocol 5 (`calls.cancelled`): an
\* entry is cleared only by the late reply it is meant for. A callee that
\* answers a cancelled running call still drops a cancelled queued one
\* without an answer (SESS-57), so that entry is never cleared and the
\* session keeps it until it closes — even with `Replies = "always"` here,
\* and for every conforming callee. This is the #626 gap `BoundedTables`
\* names; #1099 fixed it with the cancel acknowledgement (`call-gap-ack`),
\* which protocol 5 makes the rule.
\* Expected: violated:CancelledEntriesDrain.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelledEntriesDrain
