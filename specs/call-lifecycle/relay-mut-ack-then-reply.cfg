\* The protocol-5 rule broken at the second hop: C acknowledges M's cancel and
\* then still replies (`Replies = "always"`). M has already cleared its entry
\* on the ack, so the reply is one nobody can place: a conforming callee never
\* sends it (`NoStrayReply`), and M never forwards it to A.
\* Expected: violated:NoStrayReply.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "always"
    Acks = TRUE
SPECIFICATION Spec
INVARIANTS
    NoStrayReply
CHECK_DEADLOCK FALSE
