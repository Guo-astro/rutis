\* An emit's listener call (posted, nobody waits for it) nested by a
\* reentrant runtime p on top of x, which n waits for; the listener calls n.
\* Expected: deadlock.
CONSTANTS
    Runtimes = {n, p, q}
    Reentrant = {p, q}
    Policy = "current"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE
