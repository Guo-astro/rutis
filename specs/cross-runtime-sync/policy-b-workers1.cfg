\* #614, #1103: a host whose runtime has one worker thread (`Workers = 1`).
\* A Rust service call is spawned on the session's runtime and runs there,
\* so it holds one of the host's worker threads; the host's own synchronous
\* call blocks the thread that makes it, a worker when a task of the runtime
\* made it. Both are the same pool, one queue. A Rust service call that is
\* not on the waiting worker's chain needs a second one; the worker is held
\* by the host's own call, which waits for a runtime call that is buried
\* under the service call. Policy B has no edge for the host's threads, so
\* the cycle is not seen (an explicit non-guarantee). One worker is a
\* one-CPU host, or `TOKIO_WORKER_THREADS=1`: `rutis-host` does not set the
\* count, so tokio's default (available parallelism) applies.
\* `session/rpc/tests/workers.rs` pins what the implementation does.
\* Expected: deadlock.
CONSTANTS
    Runtimes = {p, q, r}
    Reentrant = {p, q}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {p, q, r}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = TRUE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 1
    Services = TRUE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE
