\* Policy A as intended: one Cordis runtime (non-reentrant), every leaf runtime reentrant.
\* Expected: deadlock.
CONSTANTS
    Runtimes = {n, p1, p2}
    Reentrant = {p1, p2}
    Policy = "A"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE
