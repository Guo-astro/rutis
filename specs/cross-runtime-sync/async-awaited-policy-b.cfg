\* An asynchronous call on a marked chain whose caller awaits it (`awaited`
\* absent or true, SESS-83) is a hop: the conservative edge. The model's
\* `acall` never blocks its runtime's stack, so its truth graph does not
\* represent this wait: `NoFalseCycle` is checked by `async-forgotten-policy-b`
\* (the fixed shape) and the code's regression, not here.
\* Expected: see README.
CONSTANTS
    Runtimes = {n, p, q}
    Reentrant = {p, q}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 4
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {n, p, q}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = TRUE
    Awaited = TRUE
    Signalled = TRUE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE
