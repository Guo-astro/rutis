\* Policy B without the stack-order rule (chain and put-aside edges only).
\* Expected: deadlock.
CONSTANTS
    Runtimes = {n1, n2, p}
    Reentrant = {p}
    Policy = "Bchain"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE
