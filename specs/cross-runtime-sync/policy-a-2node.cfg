\* Expected: deadlock.
CONSTANTS
    Runtimes = {n1, n2, p}
    Reentrant = {p}
    Policy = "A"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE
