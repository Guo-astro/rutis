\* Same id, up to 2 dials each, every fault: lost and stopped. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 2
    Faults = {"lose", "stop"}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
