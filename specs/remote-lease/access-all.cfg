\* Same id, up to 2 dials each, every fault: lost, stopped, registration
\* renewed, revoked. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 2
    MaxCalls = 0
    MaxRegs = 2
    Faults = {"lose", "stop", "registration", "revoke"}
    RevokeCheck = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    RevokedStaysOut
    RevocationScoped
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
