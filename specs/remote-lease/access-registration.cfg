\* Same id, up to 4 dials each; the access point stops and starts again
\* (2 registrations). Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 1
    MaxRegs = 2
    Faults = {"registration"}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
