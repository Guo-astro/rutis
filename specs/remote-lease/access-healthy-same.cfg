\* Two runtimes greeting with the same id, each dialing up to 4 times (3
\* reconnects); nothing lost, stopped or revoked. They take over from each
\* other until one runs out of dials. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 1
    MaxRegs = 1
    Faults = {}
    RevokeCheck = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    RevokedStaysOut
    RevocationScoped
    StoppedStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
