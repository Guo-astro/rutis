\* Two far ends greeting with the same id, each dialing up to 4 times (3
\* reconnects); nothing lost or stopped. They replace each other until one
\* runs out of dials. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    Faults = {}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
