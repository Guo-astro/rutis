\* Mutation: the runtime still reads a replaced session and applies its
\* commands to the rows it serves now. Expected: violated:OldCommandsStayOld.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    RevokeCheck = TRUE
    Mutation = "readOld"
SPECIFICATION Spec
INVARIANTS
    OldCommandsStayOld
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
