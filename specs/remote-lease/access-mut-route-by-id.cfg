\* Mutation: a replaced session is still read and its calls are routed to
\* the current instance of its id. Expected: violated:OldCallsStayOld.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 1
    MaxRegs = 1
    Faults = {}
    Mutation = "routeById"
SPECIFICATION Spec
INVARIANTS
    OldCallsStayOld
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
