\* Mutation: a takeover accepts the new connection before the old one is
\* released. Expected: violated:OneInstancePerId.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 0
    MaxRegs = 1
    Faults = {}
    Mutation = "acceptBeforeRelease"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
