\* Mutation: every connection wakes on any revocation and ends.
\* Expected: violated:RevocationScoped.
CONSTANTS
    Dialers = {d1, d2}
    SameId = FALSE
    MaxConns = 4
    MaxCalls = 0
    MaxRegs = 1
    Faults = {"revoke"}
    RevokeCheck = TRUE
    Mutation = "revokeCutsAll"
SPECIFICATION Spec
INVARIANTS
    RevocationScoped
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
