\* Mutation: a takeover stops reading the old session but waits for the
\* old controller to close it instead of closing it (healthy run).
\* Expected: violated:liveness (EndsHeld).
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = TRUE
    RevokeCheck = TRUE
    Mutation = "waitForOld"
SPECIFICATION Spec
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
