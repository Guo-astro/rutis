\* Same id, up to 4 dials each; the id or the shared token revoked, a
\* runtime stopped, at any time. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 1
    MaxRegs = 1
    Faults = {"revoke", "stop"}
    RevokeCheck = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    RevokedStaysOut
    RevocationScoped
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
