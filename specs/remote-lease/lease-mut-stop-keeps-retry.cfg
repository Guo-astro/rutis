\* Mutation: stopping a link that waits to retry leaves the retry
\* pending. Expected: violated:StoppedStaysDown.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    Mutation = "stopKeepsRetry"
SPECIFICATION Spec
INVARIANTS
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
