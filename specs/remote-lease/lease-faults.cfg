\* Two controllers, each dialing up to 4 times (3 reconnects); stop,
\* handshake timeout and lost connections at any time. Expected: ok.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    StoppedStaysDown
    ReadyIsCurrent
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
