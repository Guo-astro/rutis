\* Mutation: the new session answers its hello before the old lease is
\* cleaned. Expected: violated:OneLease.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    Mutation = "startBeforeClean"
SPECIFICATION Spec
INVARIANTS
    OneLease
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
