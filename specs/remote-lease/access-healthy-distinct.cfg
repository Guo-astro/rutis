\* Two runtimes with ids of their own, each dialing up to 4 times; nothing
\* lost, stopped or revoked. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = FALSE
    MaxConns = 4
    MaxCalls = 1
    MaxRegs = 1
    Faults = {}
    RevokeCheck = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    RevokedStaysOut
    RevocationScoped
    StoppedStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
