\* Two far ends with ids of their own, each dialing up to 4 times; nothing
\* lost or stopped. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = FALSE
    MaxConns = 4
    Faults = {}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
