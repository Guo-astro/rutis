\* Two controllers, each dialing up to 4 times (3 reconnects); nothing is
\* stopped, timed out or lost. Expected: ok, liveness included.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    StoppedStaysDown
    ReadyIsCurrent
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE
