\* Same id, up to 3 dials each (2 reconnects); handshakes time out and
\* connections are lost at any time. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 3
    MaxCalls = 0
    MaxRegs = 1
    Faults = {"lose"}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
