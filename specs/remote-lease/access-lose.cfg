\* Same id, up to 3 dials each (2 reconnects); dials and handshakes fail,
\* connections are lost and sessions end at any time. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 3
    Faults = {"lose"}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
