\* Same id, up to 3 dials each (2 reconnects); handshakes time out and
\* connections are lost at any time, the id or token revoked. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 3
    MaxCalls = 0
    MaxRegs = 1
    Faults = {"lose", "revoke"}
    RevokeCheck = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstancePerId
    OldCallsStayOld
    NoStaleHandOver
    RevokedStaysOut
    RevocationScoped
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
