\* Mutation: a greeting that arrives after the link gave up on the
\* handshake makes it ready. Expected: violated:ReadyIsCurrent.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    RevokeCheck = TRUE
    Mutation = "lateHello"
SPECIFICATION Spec
INVARIANTS
    ReadyIsCurrent
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
