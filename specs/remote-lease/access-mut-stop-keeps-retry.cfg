\* Mutation: stopping a far end that waits to redial leaves the redial
\* pending. Expected: violated:StoppedStaysDown.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    Faults = {"stop"}
    Mutation = "stopKeepsRetry"
SPECIFICATION Spec
INVARIANTS
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
