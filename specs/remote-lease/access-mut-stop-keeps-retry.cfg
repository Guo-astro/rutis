\* Mutation: stopping a runtime that waits to redial leaves the redial
\* pending. Expected: violated:StoppedStaysDown.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxCalls = 0
    MaxRegs = 1
    Faults = {"stop"}
    RevokeCheck = TRUE
    Mutation = "stopKeepsRetry"
SPECIFICATION Spec
INVARIANTS
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
