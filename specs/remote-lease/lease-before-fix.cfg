\* link.rs before the fix: the peer is provided before the revocation
\* check, so a revocation during the handshake still yields a ready
\* session. Expected: violated:RevokedStaysOut.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    Healthy = FALSE
    RevokeCheck = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    RevokedStaysOut
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
