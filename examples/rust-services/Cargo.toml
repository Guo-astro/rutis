[package]
name = "rust-services-example"
description = "An application wrapping the Rust services of a dependency crate in types marked #[rutis::service], for its TypeScript and Python rows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rust-services-calendar = { path = "calendar" }
rutis = { path = "../../crates/rutis" }

[build-dependencies]
rutis-types = { path = "../../crates/rutis-types" }

[dev-dependencies]
rutis-bridge = { path = "../../crates/rutis-bridge" }
rutis-host = { path = "../../crates/rutis-host" }
rutis-loader = { path = "../../crates/rutis-loader", features = ["node", "python"] }
rutis-test-support = { path = "../../crates/rutis-test-support" }
rutis-types = { path = "../../crates/rutis-types" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio.workspace = true
