[project]
name = "rutis"
version = "0.12.1"
description = "Write rutis plugins in Python, and the runtime that runs them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["rutis", "plugin", "rutis-plugin"]

[project.urls]
Homepage = "https://github.com/arcships/rutis"
Documentation = "https://github.com/arcships/rutis/tree/main/docs/guide"

[project.optional-dependencies]
# WebSocket channels: a runtime other machines reach (listen:ws://…, listen:wss://…).
# listen:wss:// refuses to start on CPython 3.13.6, whose TLS sockets deadlock
# (python/cpython#137583); 3.13.7 and later are fine.
network = ["websockets>=15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rutis"]

[tool.setuptools.package-data]
rutis = ["py.typed"]
