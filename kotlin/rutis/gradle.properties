# The SDK's version, released with the train (scripts/train.mjs checks it):
# the Maven coordinates io.github.arcships:rutis and
# io.github.arcships:rutis-ksp.
group=io.github.arcships
version=0.16.0
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# What Maven Central shows of each artifact (the vanniktech maven-publish
# plugin reads these; each module gives POM_NAME and POM_DESCRIPTION).
POM_URL=https://github.com/arcships/rutis
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT
POM_LICENSE_URL=https://github.com/arcships/rutis/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/arcships/rutis
POM_SCM_CONNECTION=scm:git:https://github.com/arcships/rutis.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/arcships/rutis.git
POM_DEVELOPER_ID=arcships
POM_DEVELOPER_NAME=arcships
POM_DEVELOPER_URL=https://github.com/arcships
