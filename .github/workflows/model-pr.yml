# A pull request that changes code a model in specs/ stands for either changes
# that model or says so in its description (docs/ci.md §2, #635):
#
#   模型：specs/events 不涉及（只改了错误文字）
#
# A workflow of its own rather than a job of ci.yml: the description edit that
# adds the line has to run it again (`edited`), and that must not run every
# other job of ci.yml again. `ci-ok` does not wait for it yet.
name: model-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  model:
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --files-from-git compares with the base commit: the whole history.
          fetch-depth: 0
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        run: bash tools/ci-self-hosted.sh start
      # A self-hosted runner has no Node of its own.
      - uses: actions/setup-node@v4
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'
      - name: the checker itself
        run: node tools/check-model-pr.mjs --self-test
      # The description comes through a file: an env var of the event is not
      # written into a shell command line.
      - name: model note
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          node tools/check-model-pr.mjs --body-file "$RUNNER_TEMP/body.md" --files-from-git "$BASE"
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end
