# The release train, tag vX.Y.Z: everything released together at one version
# (scripts/train.mjs checks it).
#
#   crates.io  rutis (the kernel) and its macros rutis-macros, rutis-bridge,
#              rutis-loader, rutis-host,
#              and the dylib toolchain: rutis-sdk, rutis-dylib,
#              rutis-dylib-meta, rutis-dylib-launcher
#   npm        @arcships/rutis, @arcships/rutis-runtime, @arcships/rutis-bun,
#              @arcships/rutis-host
#              (and its platform packages @arcships/rutis-host-<os>-<cpu>)
#   PyPI       rutis, rutis-host (a wheel per platform)
#   Maven      io.github.arcships:rutis, io.github.arcships:rutis-ksp (the
#              Kotlin SDK; skipped without the environment `maven`'s secrets)
#   Go         github.com/arcships/rutis/go/rutis (the tag go/rutis/vX.Y.Z;
#              the Go module proxy serves it from there)
#   GitHub     rutis-host binaries
#
# The release gate (docs/release.md, docs/design-ci-redesign-2026-10-13.md
# §5): every job of ci.yml (all=true), the Windows dylib tests
# (dylib-windows.yml), and the packages, built once (package.yml) and
# installed and run on every platform (install.yml). Nothing is published,
# the Go module tag included, unless all of it passes; what is published is
# the files the gate installed. After publishing, the registries are waited
# for (every npm platform package too), then each channel is installed again
# from its registry; a failure opens an issue. Each publish skips what its
# registry already has, so a release that fails halfway is finished by
# running it again. rutis-cli releases on its own (cli-v*, release-cli.yml).
#
# A rehearsal: `gh workflow run release.yml --ref <branch> -f dry-run=true`
# runs the whole gate on that branch and publishes nothing (the publishing
# jobs, the GitHub Release and the checks after publishing are skipped, so
# no secret or environment is used). dry-run=false publishes only on a tag
# ref (`--ref vX.Y.Z`), as a pushed tag does.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run the release gate only; publish nothing
        type: boolean
        default: true
      tag:
        description: The tag (vX.Y.Z) the train must be at (default the train's version, scripts/train.mjs)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The version: a pushed tag's, checked against the train; on a run by hand
  # the train's (the input `tag`, if given, must match). `publish` is true
  # for a pushed tag, and for a run by hand with dry-run=false on a tag ref.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            version=$(node scripts/train.mjs "$GITHUB_REF_NAME")
            publish=true
          elif [ "$DRY_RUN" = false ]; then
            # The publishing jobs take the version and the release from the
            # tag the run is on.
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "dry-run=false publishes from a tag: run it with --ref vX.Y.Z (this run is on the $GITHUB_REF_TYPE $GITHUB_REF_NAME)" >&2
              exit 1
            fi
            if [ -n "$TAG" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
              echo "the input tag is $TAG, but this run is on the tag $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version=$(node scripts/train.mjs "$GITHUB_REF_NAME")
            publish=true
          else
            version=$(node scripts/train.mjs ${TAG:+"$TAG"})
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  # Every job of ci.yml, as the nightly runs do, in parallel with the
  # packages. Its runs have a concurrency group of their own (ci-<this
  # run's id>), so it never waits on this run's group.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    # ci.yml's `changes` job reads pull requests.
    permissions:
      contents: read
      pull-requests: read
    with:
      all: true
      # The cross-version meetings leave this version out, even when a
      # re-run finds it published in part.
      release: true

  # The Windows dylib plugin tests, the reproducible-SDK check included (it
  # runs for every event but pull_request).
  dylib-windows:
    needs: verify
    uses: ./.github/workflows/dylib-windows.yml

  # Built once, by the steps the nightly runs build with (package.yml);
  # every platform is installed and run from these files before anything is
  # published (install.yml, the release gate: Q13.1.6).
  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]'

  install:
    needs: [verify, package]
    uses: ./.github/workflows/install.yml
    with:
      source: local
      build: false
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]'

  crates:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # A release whose version does not allow its API changes (a breaking
      # change in a patch release) fails here, before publishing. Crates not
      # yet on crates.io have nothing to compare with, and rutis-host has no
      # library.
      # `rust-toolchain: manual`: the toolchain above (rust-toolchain.toml),
      # not another stable one. rustup cannot replace a toolchain baked into
      # a container image (rename across filesystem layers, os error 18), and
      # self-hosted Linux runners that also carry the label ubuntu-24.04 are
      # such containers.
      - name: Check semver against the latest crates.io release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rutis,rutis-bridge,rutis-loader
          rust-toolchain: manual
      # `--registry crates-io`, here and for `cargo publish`: a self-hosted
      # runner carrying the label ubuntu-24.04 may replace crates-io with a
      # mirror in its Cargo config, and cargo then refuses to package or
      # publish for crates.io without it (0.17.2's first release attempt).
      # Dependencies are still fetched through the runner's configuration.
      - name: Package (each crate built from its package, against the others)
        run: cargo package --locked --registry crates-io $(node scripts/train.mjs --crates | sed 's/[^ ]*/-p &/g')
      - name: Publish what crates.io does not have, each after those it depends on
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in $(node scripts/train.mjs --crates); do
            if curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published"
            else
              cargo publish --locked --registry crates-io -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  npm:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # The tarballs the install gate installed and ran.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      # `--registry`, which wins over any npm configuration: a self-hosted
      # runner may point npm at a mirror (its environment or global npmrc),
      # which has neither this version nor the token (0.17.2's first release
      # attempt asked to log in to the mirror).
      - name: Publish what npm does not have
        run: |
          version="${GITHUB_REF_NAME#v}"
          registry=https://registry.npmjs.org/
          publish() {
            tarball="packages/npm/$1-$version.tgz"
            name=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            if npm view "$name@$version" version --registry "$registry" >/dev/null 2>&1; then
              echo "$name $version is already published"
            else
              npm publish "$tarball" --provenance --access public --registry "$registry"
            fi
          }
          publish arcships-rutis
          publish arcships-rutis-runtime
          publish arcships-rutis-bun
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            publish "arcships-rutis-host-$platform"
          done
          publish arcships-rutis-host
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # One job per PyPI project, each in its own environment: PyPI matches a
  # trusted-publishing token to a single publisher, so two projects with
  # identical publishers (same workflow and environment) cannot share a job.
  pypi:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      # The rutis package the install gate installed.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - run: mkdir dist && cp packages/wheels/* dist/
      # uv, not pypa/gh-action-pypi-publish: that action is a Docker image,
      # and a self-hosted Linux runner carrying the label ubuntu-24.04 may
      # have no Docker. --check-url skips the files PyPI already has.
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ dist/*

  pypi-host:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: pypi-host
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # uv, as in the job pypi: no Docker.
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ dist/*

  # Maven Central: the Kotlin SDK, io.github.arcships:rutis (jvm and
  # android) and io.github.arcships:rutis-ksp, under the namespace
  # io.github.arcships of the Central Portal. Its credentials are the
  # secrets of the environment `maven` (docs/release.md): without them the
  # job says so in the summary and skips, and the rest of the train is not
  # held up. A version Maven Central already has is skipped too.
  maven:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: maven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Set once an upload of this version started, before Gradle runs: a
      # re-run then knows a deployment of it may still be publishing.
      - name: earlier upload of this version
        id: uploaded
        uses: actions/cache/restore@v4
        with:
          path: .maven-uploaded
          key: maven-uploaded-${{ needs.verify.outputs.version }}
      - name: what Maven Central lacks
        id: lacking
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          UPLOADED: ${{ steps.uploaded.outputs.cache-hit }}
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: |
          missing=
          [ -n "$USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$SIGNING_KEY" ] || missing="$missing MAVEN_SIGNING_KEY"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing MAVEN_SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            message="Maven Central skipped: the environment maven has no$missing (docs/release.md)"
            echo "::warning title=Maven Central skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "tasks=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the Central Portal published, from its publisher API
          # (repo1.maven.org lags behind it). It says so only once a
          # deployment finished publishing (10 to 30 minutes after the
          # upload): after an earlier upload of this version, what is not
          # published yet is waited for, up to 45 minutes, instead of uploaded
          # again, which the Portal would refuse as a duplicate.
          auth=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          published() {
            local answer
            answer=$(curl -sfS --retry 3 -H "Authorization: Bearer $auth" \
              "https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.arcships&name=$1&version=$VERSION") \
              || { echo "the Central Portal did not say whether io.github.arcships:$1 $VERSION is published" >&2; exit 1; }
            echo "$answer" | jq -e '.published == true' > /dev/null
          }
          tasks=
          for artifact in rutis rutis-ksp; do
            if [ "$UPLOADED" = true ] && ! published "$artifact"; then
              echo "an earlier run uploaded $VERSION: waiting for io.github.arcships:$artifact to finish publishing"
              for _ in $(seq 90); do
                published "$artifact" && break
                sleep 30
              done
            fi
            if published "$artifact"; then
              echo "Maven Central has io.github.arcships:$artifact $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              [ "$UPLOADED" = true ] && echo "::warning title=Maven Central::io.github.arcships:$artifact $VERSION was uploaded before but is not published 45 minutes on (a failed deployment, or an upload that never started): uploading it again"
              tasks="$tasks :$artifact:publishAndReleaseToMavenCentral"
            fi
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - name: mark the upload
        if: steps.lacking.outputs.tasks != '' && steps.uploaded.outputs.cache-hit != 'true'
        run: date -u > .maven-uploaded
      - if: steps.lacking.outputs.tasks != '' && steps.uploaded.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .maven-uploaded
          key: maven-uploaded-${{ needs.verify.outputs.version }}
      - name: publish to Maven Central
        if: steps.lacking.outputs.tasks != ''
        working-directory: kotlin/rutis
        env:
          TASKS: ${{ steps.lacking.outputs.tasks }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
          # The plugin waits until the deployment is published; publishing
          # can take longer than its default 15 minutes.
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: '3600'
        run: |
          # The android variant is built only with an Android SDK, which
          # GitHub's Ubuntu image has.
          [ -d "${ANDROID_HOME:-}/platforms" ] || { echo "no Android SDK (ANDROID_HOME): the android variant would be missing" >&2; exit 1; }
          read -ra tasks <<< "$TASKS"
          ./gradlew --no-daemon "${tasks[@]}"

  # A Go module in a subdirectory is released by a tag with its path; the
  # tag is a publication, so it waits for the whole gate too.
  go:
    needs: [verify, ci, install, dylib-windows]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/rutis/go.mod
      - run: go test ./...
        working-directory: go/rutis
      - name: tag go/rutis
        run: |
          tag="go/rutis/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  github:
    needs: [verify, crates, npm, pypi, pypi-host]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/rutis-host-* \
            --title "rutis $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.en.md"
        env:
          GH_TOKEN: ${{ github.token }}

  # After publishing: each channel from its registry, on Linux, and the
  # crate and the Go module (Q6.15.3). The registries can take minutes to
  # serve a new version; this waits for them first, every npm package of
  # the train included. On a dry run it is skipped with what it needs. A
  # failure opens an issue; whether to deprecate or yank is the maintainer's
  # decision (docs/release.md, Q13.2).
  published:
    needs: [verify, github, go]
    runs-on: ubuntu-24.04
    # The registries themselves, not a mirror a self-hosted runner may be
    # configured with: what is checked is that they serve this version.
    # (Cargo has no such variable: its step uses a Cargo home of its own.)
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Every npm package of the train (scripts/train.mjs --npm), the
      # platform packages included: npm installs @arcships/rutis-host without
      # a platform package it cannot fetch yet, and the launcher then fails;
      # a package not served yet fails its install (ETARGET).
      - name: wait for the registries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          packages=$(node scripts/train.mjs --npm)
          served() { npm view "$1" version --prefer-online >/dev/null 2>&1; }
          # What the registries do not serve yet, one line each.
          missing() {
            for package in $packages; do
              served "$package@$VERSION" || echo "npm $package@$VERSION"
            done
            curl -sf "https://pypi.org/pypi/rutis-host/$VERSION/json" >/dev/null || echo "PyPI rutis-host $VERSION"
            curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/rutis-host/$VERSION" >/dev/null \
              || echo "crates.io rutis-host $VERSION"
          }
          # 15 minutes: a hang guard, not a synchronization.
          while :; do
            left=$(missing)
            if [ -z "$left" ]; then
              echo "the registries serve $VERSION"
              exit 0
            fi
            [ "$SECONDS" -lt 900 ] || break
            sleep 15
          done
          echo "after 15 minutes the registries still do not serve:" >&2
          echo "$left" >&2
          exit 1
      - name: the crate and the Go module
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          # No Cargo configuration, so no mirror replacing crates.io; the
          # toolchain itself is found on PATH as before.
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          cargo install --locked "rutis-host@$VERSION" --root "$RUNNER_TEMP/cargo"
          "$RUNNER_TEMP/cargo/bin/rutis-host" --version | grep -x "rutis-host $VERSION"
          (cd "$RUNNER_TEMP" && go mod init check && GOFLAGS=-mod=mod go list -m "github.com/arcships/rutis/go/rutis@v$VERSION")

  installed:
    needs: [verify, published]
    uses: ./.github/workflows/install.yml
    with:
      source: registry
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64"]'

  report:
    needs: [verify, crates, npm, pypi, pypi-host, maven, go, github, published, installed]
    # Anything that failed after publishing began. A partial publish (go or
    # github failed) leaves `published` skipped, so its result cannot say
    # whether anything was published; verify's `publish` can. `always()`
    # because a skipped dependency would otherwise skip this job too.
    # Publishing began only if a publishing job ran: when the gate fails
    # they are all skipped, nothing was published, and the failed run says
    # so. `contains(needs.*.result, 'failure')` alone is true then too: a job
    # skipped because the gate failed counts as failed in this expression
    # (#655, #717), though its result reads `skipped`.
    if: >-
      always() && needs.verify.outputs.publish == 'true'
      && contains(needs.*.result, 'failure')
      && (needs.crates.result != 'skipped' || needs.npm.result != 'skipped'
        || needs.pypi.result != 'skipped' || needs.pypi-host.result != 'skipped'
        || needs.maven.result != 'skipped' || needs.go.result != 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Which channels published and which did not: a partial publish is
          # the case this reports on too.
          {
            echo "The release of $VERSION failed after publishing began: $RUN"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo
            echo "Whether to deprecate (npm) or yank (PyPI, crates.io) the release and publish a fix is decided by hand; see docs/release.md."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee eric8810 \
            --title "release $VERSION: a job failed after publishing began" \
            --body-file "$RUNNER_TEMP/issue.md"
