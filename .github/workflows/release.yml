# The release train, tag vX.Y.Z: everything released together at one version
# (scripts/train.mjs checks it).
#
#   crates.io  rutis (the kernel), rutis-bridge, rutis-loader, rutis-host,
#              and the dylib toolchain: rutis-sdk, rutis-dylib,
#              rutis-dylib-meta, rutis-dylib-launcher
#   npm        @arcships/rutis, @arcships/rutis-runtime, @arcships/rutis-bun,
#              @arcships/rutis-host
#              (and its platform packages @arcships/rutis-host-<os>-<cpu>)
#   PyPI       rutis, rutis-host (a wheel per platform)
#   Go         github.com/arcships/rutis/go/rutis (the tag go/rutis/vX.Y.Z;
#              the Go module proxy serves it from there)
#   GitHub     rutis-host binaries
#
# The packages are built once (package.yml) and installed and run on every
# platform before anything is published (install.yml); what is published is
# those files. After publishing, each channel is installed again from its
# registry; a failure opens an issue. Each publish skips what its registry
# already has, so a release that fails halfway is finished by running it
# again. rutis-cli releases on its own
# (cli-v*, release-cli.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/train.mjs "$GITHUB_REF_NAME"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Built once, by the steps main builds with (package.yml); every
  # platform is installed and run from these files before anything is
  # published (install.yml, the release gate: Q13.1.6).
  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]'

  install:
    needs: [verify, package]
    uses: ./.github/workflows/install.yml
    with:
      source: local
      build: false
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]'

  crates:
    needs: install
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # A release whose version does not allow its API changes (a breaking
      # change in a patch release) fails here, before publishing. Crates not
      # yet on crates.io have nothing to compare with, and rutis-host has no
      # library.
      - name: Check semver against the latest crates.io release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rutis,rutis-bridge,rutis-loader
      - name: Package (each crate built from its package, against the others)
        run: cargo package --locked $(node scripts/train.mjs --crates | sed 's/[^ ]*/-p &/g')
      - name: Publish what crates.io does not have, each after those it depends on
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in $(node scripts/train.mjs --crates); do
            if curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  npm:
    needs: install
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # The tarballs the install gate installed and ran.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Publish what npm does not have
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish() {
            tarball="packages/npm/$1-$version.tgz"
            name=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name $version is already published"
            else
              npm publish "$tarball" --provenance --access public
            fi
          }
          publish arcships-rutis
          publish arcships-rutis-runtime
          publish arcships-rutis-bun
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            publish "arcships-rutis-host-$platform"
          done
          publish arcships-rutis-host
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # One job per PyPI project, each in its own environment: PyPI matches a
  # trusted-publishing token to a single publisher, so two projects with
  # identical publishers (same workflow and environment) cannot share a job.
  pypi:
    needs: install
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      # The rutis package the install gate installed.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - run: mkdir dist && cp packages/wheels/* dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  pypi-host:
    needs: install
    runs-on: ubuntu-24.04
    environment: pypi-host
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # A Go module in a subdirectory is released by a tag with its path.
  go:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/rutis/go.mod
      - run: go test ./...
        working-directory: go/rutis
      - name: tag go/rutis
        run: |
          tag="go/rutis/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  github:
    needs: [crates, npm, pypi, pypi-host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/rutis-host-* \
            --title "rutis $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.en.md"
        env:
          GH_TOKEN: ${{ github.token }}

  # After publishing: each channel from its registry, on Linux, and the
  # crate and the Go module (Q6.15.3). The registries can take minutes to
  # serve a new version; this waits for them first (a hang guard, not a
  # synchronization). A failure opens an issue; whether to deprecate or
  # yank is the maintainer's decision (docs/release.md, Q13.2).
  published:
    needs: [verify, github, go]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: wait for the registries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for i in $(seq 60); do
            npm view "@arcships/rutis-host@$VERSION" version >/dev/null 2>&1 \
              && curl -sf "https://pypi.org/pypi/rutis-host/$VERSION/json" >/dev/null \
              && curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/rutis-host/$VERSION" >/dev/null \
              && exit 0
            sleep 15
          done
          echo "the registries do not serve $VERSION after 15 minutes" >&2
          exit 1
      - name: the crate and the Go module
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cargo install --locked "rutis-host@$VERSION" --root "$RUNNER_TEMP/cargo"
          "$RUNNER_TEMP/cargo/bin/rutis-host" --version | grep -x "rutis-host $VERSION"
          (cd "$RUNNER_TEMP" && go mod init check && GOFLAGS=-mod=mod go list -m "github.com/arcships/rutis/go/rutis@v$VERSION")

  installed:
    needs: [verify, published]
    uses: ./.github/workflows/install.yml
    with:
      source: registry
      version: ${{ needs.verify.outputs.version }}
      platforms: '["linux-x64"]'

  report:
    needs: [verify, published, installed]
    # Only for what was published: a failed gate published nothing.
    if: failure() && needs.published.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee eric8810 \
            --title "release $VERSION: the published packages failed to install or run" \
            --body "The checks after publishing $VERSION failed: $RUN. Whether to deprecate (npm) or yank (PyPI, crates.io) the release and publish a fix is decided by hand; see docs/release.md."
