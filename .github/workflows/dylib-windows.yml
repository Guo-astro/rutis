# Windows dylib plugin tests, about 40 minutes with the reproducibility
# check. Pull requests do not run them (Q12.1, #569): they cost 11–14 minutes
# there and their failures did not stop a merge (ci-ok only sums up ci.yml's
# jobs). The nightly runs (nightly.yml) and the release gate (release.yml)
# call them; manual runs: Actions → dylib-windows → Run workflow.
# Other Windows builds are checked on every code change by ci.yml's
# runtimes-windows job.
#
# Changes elsewhere (the rutis kernel, dependency updates in Cargo.lock) can
# also break Windows dylib plugins; the nightly run catches those after the
# merge.

name: dylib-windows

on:
  workflow_dispatch:
  # The nightly runs (nightly.yml; quality status §8.4) and the release gate
  # (release.yml).
  workflow_call:

# A run has a group of its own (github.run_id is the caller's for a call),
# as in ci.yml.
concurrency:
  group: dylib-windows-${{ github.run_id }}

permissions:
  contents: read

jobs:
  dylib-windows:
    # The repository variable WINDOWS_RUNNER (JSON) switches it to the
    # organization's self-hosted Windows runners, as ci.yml's
    # runtimes-windows (docs/ci.md §11).
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-2025"') }}
    defaults:
      run:
        # Git's bash (on PATH, self-hosted too: docs/ci.md §11).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Several runner instances share the machine: each keeps its own
      # target directory (the one runtimes-windows uses, outside the
      # checkout, which `checkout` cleans) and takes its share of the CPUs
      # (WINDOWS_CI_JOBS overrides it). The scripts leave their
      # mktemp -d /tmp/rutis-* directories (the reproducible-SDK check two
      # source copies and two release builds); Git's bash maps /tmp to the
      # service account's temporary directory, which all instances share and
      # TMP/TEMP do not change. As on the self-hosted Macs
      # (tools/ci-self-hosted.sh), ones older than 12 hours are removed: no
      # job runs that long, so they are no running job's.
      - name: self-hosted runner, start
        if: runner.environment == 'self-hosted'
        env:
          JOBS: ${{ vars.WINDOWS_CI_JOBS }}
        run: |
          dir="$(cygpath -m "$RUNNER_WORKSPACE/..")/_rutis-ci"
          mkdir -p "$dir/target"
          jobs=${JOBS:-$((NUMBER_OF_PROCESSORS / 4))}
          [ "$jobs" -ge 2 ] || jobs=2
          echo "$NUMBER_OF_PROCESSORS CPUs: $jobs jobs and test threads; $dir"
          {
            # A target directory of this job's own (tools/ci-self-hosted.sh,
            # RUTIS_CI_FRESH_TARGET): kept dylib builds go stale (#376).
            echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_TEMP")/target"
            echo "CARGO_BUILD_JOBS=$jobs"
            echo "RUST_TEST_THREADS=$jobs"
            echo "GOCACHE=$dir/go-build"
          } >> "$GITHUB_ENV"
          echo "/tmp is $(cygpath -w /tmp)"
          # find exits non-zero when it cannot read an entry (one still in
          # use, or another account's); under pipefail that failed the job
          # before it started. The cleanup is best effort.
          { find /tmp/ -maxdepth 1 -name 'rutis-*' -mmin +720 -print 2>/dev/null || true; } |
            while IFS= read -r old; do rm -rf "$old" || true; done
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: plugin file checks
        run: cargo test -p rutis-dylib-meta
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap, pre-load rejection and planted DLLs
        run: bash tools/test-dylib.sh
      # Also checks the release rutis_sdk.dll exports at most 30000 symbols
      # (in tools/build-dylib-bundle.sh) and that files are held while the host runs.
      # One runtime bundle for the launcher and the external plugin checks,
      # which only read it.
      - name: the runtime bundle
        id: bundle
        run: echo "dir=$(bash tools/build-dylib-bundle.sh "$RUNNER_TEMP/bundle" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: launcher pre-execution verification, file locks and job object
        run: bash tools/test-dylib-launcher.sh "${{ steps.bundle.outputs.dir }}"
      - name: reproducible SDK across source and target paths
        run: bash tools/test-dylib-repro.sh
      - name: external plugin build against a prebuilt SDK
        run: bash tools/test-sdk-bundle.sh "${{ steps.bundle.outputs.dir }}"
      # After a failure, this instance's Go build cache goes (a job cut
      # short can leave it truncated, #374; tools/ci-self-hosted.sh does the
      # same on the other self-hosted runners).
      - name: self-hosted runner, end
        if: failure() && runner.environment == 'self-hosted'
        run: rm -rf "$GOCACHE"
