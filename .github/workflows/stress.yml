# The rutis kernel tests run many times over, to catch failures that depend
# on how tasks interleave and show up only once in a while; so do the
# rutis-bridge and rutis-loader tests that start real runtime processes
# (Node, Python, Bun, Go), which otherwise fail once in a while on someone
# else's pull request. The network stack soaks (links cut and relinked,
# processes started and ended, over and over) check that nothing piles up.
# Runs in the nightly runs (nightly.yml calls it) and on demand.
#
# Each round of the rutis tests varies what it can: the number of test
# threads (1, 2, all cores), the test order (shuffled), the build (every
# fifth round is a release build) and the seed of the randomized tests.
# The seed of a round drives both the order and `RUTIS_SEED`; a failing
# round prints its output, its settings and a command that replays it.
# A failure is never retried.
#
# Two more kinds of check run here at nightly scale (#179): the shuttle
# models of the kernel, which pull requests run with 1000 iterations in
# ci.yml's `rust` job, with many more; and the fuzz targets in fuzz/, each
# for a fixed time.
#
# And the host soak S8 (#192): rutis-host itself, for an hour, with random
# operations, then every way of ending it, on Linux, macOS and Windows.
#
# And the unified events conformance suite (#464) in every placement
# (`events-all`): pull requests run a sample of them.
name: stress

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: How many times to run the rutis tests and the multi-process tests
        default: "20"
      soak_secs:
        description: How long each soak runs, in seconds
        default: "600"
      shuttle_iterations:
        description: Iterations of each shuttle scheduler, per model
        default: "1000000"
      fuzz_secs:
        description: How long each fuzz target runs, in seconds
        default: "1200"
      host_soak_secs:
        description: How long the S8 host soak runs on each platform, in seconds
        default: "3600"
      events_case:
        description: The events conformance cases every placement of which runs (RUTIS_EVENTS_CASE, prefixes); empty, all of them in shards
        default: ""
      events:
        description: Events conformance placements (all, or sampled)
        default: all
  # nightly.yml, with the defaults.
  workflow_call:
    inputs:
      rounds:
        type: string
        default: "20"
      soak_secs:
        type: string
        default: "600"
      shuttle_iterations:
        type: string
        default: "1000000"
      fuzz_secs:
        type: string
        default: "1200"
      host_soak_secs:
        type: string
        default: "3600"
      events_case:
        type: string
        default: ""
      events:
        description: Events conformance placements (all, or sampled)
        type: string
        default: "all"

permissions:
  contents: read

jobs:
  rutis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the rutis tests (debug and release)
        # bash -eo pipefail: a failing build fails the step through jq.
        shell: bash
        run: |
          for profile in debug release; do
            flag=; [ "$profile" = release ] && flag=--release
            cargo test -p rutis $flag --no-run --message-format=json \
              | jq -r 'select(.profile.test == true and .executable != null) | .executable' \
              > "$RUNNER_TEMP/tests-$profile.txt"
            echo "$profile:"; cat "$RUNNER_TEMP/tests-$profile.txt"
            # No binaries would make every round pass without running anything.
            [ -s "$RUNNER_TEMP/tests-$profile.txt" ] || { echo "::error::no $profile test binaries"; exit 1; }
          done
      - name: Repeat the rutis tests
        # The test binaries run from the package directory, as under
        # `cargo test`. Shuffling is an unstable libtest option; the
        # RUSTC_BOOTSTRAP below reaches only the test binaries, not the
        # build. Doc tests are not repeated.
        working-directory: crates/rutis
        env:
          ROUNDS: ${{ inputs.rounds || '20' }}
        run: |
          case "$ROUNDS" in ""|*[!0-9]*) echo "::error::rounds must be a number"; exit 1;; esac
          cores=$(nproc)
          summary="$RUNNER_TEMP/summary.md"
          {
            echo "### rutis tests, $ROUNDS rounds"
            echo
            echo "| round | build | test threads | seed | result |"
            echo "| --- | --- | --- | --- | --- |"
          } > "$summary"
          status=0
          for round in $(seq 1 "$ROUNDS"); do
            case $((round % 3)) in 1) threads=1;; 2) threads=2;; *) threads=$cores;; esac
            if [ $((round % 5)) -eq 0 ]; then profile=release; else profile=debug; fi
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            echo "round $round of $ROUNDS: $profile build, --test-threads=$threads, seed $seed"
            failed=
            : > "$RUNNER_TEMP/out.txt"
            while read -r test; do
              if ! RUTIS_SEED=$seed RUSTC_BOOTSTRAP=1 "$test" -q --test-threads="$threads" \
                  -Z unstable-options --shuffle-seed "$seed" < /dev/null >> "$RUNNER_TEMP/out.txt" 2>&1; then
                failed=$(basename "$test")
                break
              fi
            done < "$RUNNER_TEMP/tests-$profile.txt"
            if [ -n "$failed" ]; then
              cat "$RUNNER_TEMP/out.txt"
              flag=; [ "$profile" = release ] && flag=" --release"
              echo "| $round | $profile | $threads | $seed | failed in \`$failed\` |" >> "$summary"
              {
                echo
                echo "Replay: \`RUTIS_SEED=$seed RUSTC_BOOTSTRAP=1 cargo test -p rutis$flag --tests -- --test-threads=$threads -Z unstable-options --shuffle-seed $seed\`"
              } >> "$summary"
              echo "::error title=rutis stress::round $round of $ROUNDS failed in $failed ($profile build, --test-threads=$threads, seed $seed)"
              status=1
              break
            fi
            echo "| $round | $profile | $threads | $seed | passed |" >> "$summary"
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The rutis-bridge and rutis-loader tests that start processes, open local
  # channels or start runtime processes, many times over, with the runtimes
  # of the `rust` job of ci.yml. Which test files: those pull requests run on
  # macOS and Windows, every test file but the PURE_TESTS_BRIDGE and
  # PURE_TESTS_LOADER lists of ci.yml (tools/platform-tests.sh), so a new
  # test file is repeated here too.
  #
  # Each round varies the number of test threads (1, 2, all cores), the test
  # order (shuffled) and the seed. A round runs every test binary even after
  # one fails, and every round runs even after one fails, so the summary lists
  # every failing test and round; the job fails at the end if any round
  # failed. A failure is never retried. When a round fails, the output of
  # every test binary of every round is uploaded.
  multiprocess:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The runtime versions of the `rust` job of ci.yml: the oldest supported.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/rutis-runtime/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install "websockets==15.*"
      - uses: actions/setup-go@v5
        with:
          go-version: oldstable
          cache-dependency-path: go/rutis/go.mod
      - name: Build the multi-process tests
        # bash -eo pipefail: a failing build fails the step through jq.
        # Each line of tests.tsv: package, features, target, package
        # directory, test binary.
        shell: bash
        run: |
          list="$RUNNER_TEMP/tests.tsv"
          : > "$list"
          build() {
            package=$1 features=$2 targets=$3
            [ -n "$targets" ] && [ "$targets" != null ] || { echo "::error::no $package test files in ci.yml"; exit 1; }
            # shellcheck disable=SC2086 # the features and targets split into flags
            cargo test -p "$package" $features $targets --no-run --message-format=json \
              | jq -r --arg package "$package" --arg features "$features" \
                  'select(.profile.test == true and .executable != null)
                   | [$package, $features,
                      (if .target.kind[0] == "lib" then "--lib" else "--test " + .target.name end),
                      (.manifest_path | rtrimstr("/Cargo.toml")), .executable]
                   | @tsv' >> "$list"
          }
          # shellcheck disable=SC2046 # the list splits into test names
          build rutis-bridge --all-features "$(bash tools/platform-tests.sh crates/rutis-bridge $(yq -r '.env.PURE_TESTS_BRIDGE' .github/workflows/ci.yml))"
          # events_conformance runs in events-all instead: one round of
          # it takes longer than a test binary may here.
          # shellcheck disable=SC2046 # the list splits into test names
          build rutis-loader "--features node,go" "$(bash tools/platform-tests.sh crates/rutis-loader $(yq -r '.env.PURE_TESTS_LOADER' .github/workflows/ci.yml) | sed 's/ --test events_conformance / /')"
          cut -f1,3 "$list"
          # No binaries would make every round pass without running anything.
          [ -s "$list" ] || { echo "::error::no test binaries"; exit 1; }
      - name: Repeat the multi-process tests
        # The test binaries run from their package directory, as under
        # `cargo test`. Shuffling is an unstable libtest option; the
        # RUSTC_BOOTSTRAP below reaches only the test binaries, not the
        # build. A test binary still running after 5 minutes is stopped and
        # counts as failed. Doc tests are not repeated.
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '20' }}
        run: |
          case "$ROUNDS" in ""|*[!0-9]*) echo "::error::rounds must be a number"; exit 1;; esac
          cores=$(nproc)
          logs="$RUNNER_TEMP/multiprocess-logs"
          failures="$RUNNER_TEMP/failures.tsv"
          table="$RUNNER_TEMP/table.md"
          replays="$RUNNER_TEMP/replays.md"
          mkdir -p "$logs"
          : > "$failures"; : > "$table"; : > "$replays"
          for round in $(seq 1 "$ROUNDS"); do
            case $((round % 3)) in 1) threads=1;; 2) threads=2;; *) threads=$cores;; esac
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            echo "round $round of $ROUNDS: --test-threads=$threads, seed $seed"
            mkdir -p "$logs/round-$round"
            failed=
            while IFS=$'\t' read -r package features selector dir test; do
              target=${selector#--test }; target=${target#--}
              log="$logs/round-$round/$package-$target.txt"
              code=0
              (cd "$dir" && RUTIS_SEED=$seed RUSTC_BOOTSTRAP=1 timeout -k 30 300 "$test" -q \
                --test-threads="$threads" -Z unstable-options --shuffle-seed "$seed") \
                < /dev/null > "$log" 2>&1 || code=$?
              [ "$code" -eq 0 ] && continue
              # The tests that failed, one per line; a binary stopped or
              # crashed without naming one counts as a whole.
              names=$(sed -n 's/^---- \(.*\) stdout ----$/\1/p' "$log")
              if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
                names=$(printf '%s\n%s' "$names" "(timed out)" | sed '/^$/d')
              elif [ -z "$names" ]; then
                names="(exit status $code)"
              fi
              echo "::group::round $round: $package $target failed"
              cat "$log"
              echo "::endgroup::"
              while IFS= read -r name; do
                printf '%s\t%s\t%s\n' "$round" "$package $target" "$name" >> "$failures"
              done <<< "$names"
              failed="$failed${failed:+, }\`$package $target\` ($(wc -l <<< "$names"))"
              echo "::error title=multi-process stress::round $round of $ROUNDS: $package $target failed: $(paste -sd, - <<< "$names") (--test-threads=$threads, seed $seed)"
              echo "- round $round, $package $target: \`RUTIS_SEED=$seed RUSTC_BOOTSTRAP=1 cargo test -p $package $features $selector -- --test-threads=$threads -Z unstable-options --shuffle-seed $seed\`" >> "$replays"
            done < "$RUNNER_TEMP/tests.tsv"
            # The failing test binaries, with how many of their tests failed.
            if [ -n "$failed" ]; then result="failed: $failed"; else result=passed; fi
            echo "| $round | $threads | $seed | $result |" >> "$table"
          done
          {
            echo "### Multi-process tests (rutis-bridge, rutis-loader), $ROUNDS rounds"
            echo
            echo "| round | test threads | seed | result |"
            echo "| --- | --- | --- | --- |"
            cat "$table"
            if [ -s "$failures" ]; then
              echo
              echo "#### Failing tests"
              echo
              echo "| test | failed in rounds |"
              echo "| --- | --- |"
              awk -F'\t' '{ key = "`" $2 "::" $3 "`"
                            if (key in rounds) rounds[key] = rounds[key] ", " $1
                            else { order[n++] = key; rounds[key] = $1 } }
                          END { for (i = 0; i < n; i++) print "| " order[i] " | " rounds[order[i]] " |" }' "$failures"
              echo
              echo "#### Replay"
              echo
              cat "$replays"
              echo
              echo "The output of every test binary of every round is in the \`multiprocess-logs\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Any failing round fails the job, after all of them have run.
          [ ! -s "$failures" ]
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiprocess-logs
          path: ${{ runner.temp }}/multiprocess-logs
          retention-days: 14

  # The unified events conformance suite (#464,
  # crates/rutis-loader/tests/events_conformance.rs) in every placement of
  # every case (RUTIS_EVENTS_PLACEMENTS=all, about 22 000 per language
  # under test), where full runs of ci.yml run a sample and pull requests
  # the written placements (ci.yml `rust`). Sharded
  # by the language under test (X, the emitter's in most cases) and by
  # case: the shards are case id prefixes of about 5000 placements each,
  # so each job takes about 15 to 25 minutes. With the input `events_case`
  # every job runs the placements of those cases instead (a small run to
  # check this job). The runtimes of the `rust` job of ci.yml; every
  # language must be there (RUTIS_TEST_RUNTIMES). Each job writes its
  # table of cases and its time to the summary.
  events-all:
    name: events-all (${{ matrix.x }}, ${{ matrix.cases }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        x: [node, node-leaf, bun, python, go]
        cases: ${{ fromJSON(inputs.events_case != '' && format('["{0}"]', inputs.events_case) || '["serial/", "order/", "waterfall,bail/", "parallel/,scope/,filter/", "emit/,unload/,values/,kinds/,rutis/,disconnect/,node/,cancel/,cordis/,reserved/,registration/,rust/,modes/"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/rutis-runtime/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install "websockets==15.*"
      - uses: actions/setup-go@v5
        with:
          go-version: oldstable
          cache-dependency-path: go/rutis/go.mod
      - run: cargo test -p rutis-loader --all-features --test events_conformance --no-run
      - name: Every placement
        # bash -eo pipefail: a failing run fails the step through tee.
        shell: bash
        env:
          RUTIS_TEST_RUNTIMES: bun,go,node,python
          RUTIS_EVENTS_PLACEMENTS: ${{ inputs.events || 'all' }}
          RUTIS_EVENTS_CASE: ${{ matrix.cases }}
          RUTIS_EVENTS_SETTLE_SCALE: '2'
          X: ${{ matrix.x }}
        run: |
          test=events_with_x_a_${X//-/_}_plugin
          case "$X" in node) test=events_with_x_a_cordis_plugin;; esac
          started=$(date +%s)
          status=0
          cargo test -p rutis-loader --all-features --test events_conformance -- \
            --exact "$test" --nocapture 2>&1 | tee "$RUNNER_TEMP/events.txt" || status=$?
          {
            echo "### events conformance, X=$X, $RUTIS_EVENTS_PLACEMENTS placements of $RUTIS_EVENTS_CASE"
            echo
            echo "$(( $(date +%s) - started )) s"
            echo
            echo '```'
            grep -E '^(events conformance|FAIL |known failing |[0-9]+ of [0-9]+ cases)' "$RUNNER_TEMP/events.txt" | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: events-all-${{ matrix.x }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/events.txt
          retention-days: 14

  soak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rutis-bridge --features websocket --test websocket_soak --test local_soak --no-run
      - name: Soak the network stack
        # bash -eo pipefail: a failing soak fails the step through tee.
        shell: bash
        env:
          RUTIS_SOAK_SECS: ${{ inputs.soak_secs || '600' }}
        run: |
          case "$RUTIS_SOAK_SECS" in ""|*[!0-9]*) echo "::error::soak_secs must be a number"; exit 1;; esac
          cargo test -q -p rutis-bridge --features websocket --test websocket_soak -- --ignored --nocapture 2>&1 | tee websocket.txt
          cargo test -q -p rutis-bridge --test local_soak -- --ignored --nocapture 2>&1 | tee local.txt
          grep -h '^soak:' websocket.txt local.txt >> "$GITHUB_STEP_SUMMARY"

  # S8 (#192, tests/e2e/tests/soak.rs): one rutis-host run for
  # `host_soak_secs` with random operations from a seed (configuration
  # edits and reloads, runtimes killed, the link to a node cut), its
  # resources sampled and their growth bounded; then a host for every way of
  # ending (Ctrl-C, SIGTERM, kill -9), each leaving no process behind. On the
  # three platforms, with the runtimes of the e2e jobs of ci.yml (docs/ci.md
  # §9: the oldest on Linux, the latest on macOS and Windows). A failure
  # prints the seed and a replay command; the scenario's directory (its
  # operations, samples and every host's output in logs/) is uploaded.
  soak-host:
    name: soak-host (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.os == 'linux' && (vars.LINUX_RUNNER || '"ubuntu-24.04"') || matrix.os == 'macos' && (vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') || (vars.WINDOWS_RUNNER || '"windows-2025"')) }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            node: '22'
            python: '3.12'
            websockets: '==15.*'
            bun: 1.4.0
          - os: macos
            node: '26'
            python: '3.x'
            websockets: '>=15'
            bun: latest
          - os: windows
            node: '26'
            python: '3.x'
            websockets: '>=15'
    defaults:
      run:
        # Git's bash on Windows (docs/ci.md §11).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      # As ci.yml's runtimes-windows: this instance's own target and
      # scenario directories, outside the checkout.
      - name: self-hosted Windows runner, start
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        env:
          JOBS: ${{ vars.WINDOWS_CI_JOBS }}
        run: |
          dir="$(cygpath -m "$RUNNER_WORKSPACE/..")/_rutis-ci"
          rm -rf "$dir/e2e"
          mkdir -p "$dir/target" "$dir/e2e"
          jobs=${JOBS:-$((NUMBER_OF_PROCESSORS / 4))}
          [ "$jobs" -ge 2 ] || jobs=2
          {
            echo "CARGO_TARGET_DIR=$dir/target"
            echo "RUTIS_E2E_DIR=$dir/e2e"
            echo "CARGO_BUILD_JOBS=$jobs"
          } >> "$GITHUB_ENV"
      # GitHub's runners: short on Unix, for the Unix socket paths under it
      # (tests/e2e/src/lib.rs).
      - name: scenario directory
        if: runner.environment == 'github-hosted'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "RUTIS_E2E_DIR=$(cygpath -m "$RUNNER_TEMP")/e2e" >> "$GITHUB_ENV"
          else
            echo "RUTIS_E2E_DIR=/tmp/rutis-e2e" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm --prefix node/rutis-runtime ci
      # No Bun on Windows: the scenario has no Bun rows there.
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
        with:
          bun-version: ${{ matrix.bun }}
      # Python as in ci.yml: setup-python on GitHub's runners and on the
      # self-hosted Linux (there it installs into the tool cache, not the
      # system Python that PEP 668 protects); uv's on the self-hosted Mac,
      # the machine's on the self-hosted Windows, each in a virtual
      # environment with pip.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted' || runner.os == 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      - name: Python (self-hosted Mac)
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          uv python install 3
          uv venv --seed --python-preference only-managed --python 3 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: Python (self-hosted Windows)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          cygpath -w "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
      - name: websockets
        env:
          VERSION: ${{ matrix.websockets }}
        run: |
          python=python3; [ "$RUNNER_OS" = Windows ] && python=python
          "$python" -m pip install "websockets$VERSION"
      - run: cargo test -p rutis-e2e --test soak --no-run
      - name: Soak the host (S8)
        # bash -eo pipefail: a failing soak fails the step through tee.
        env:
          RUTIS_S8_SECS: ${{ inputs.host_soak_secs || '3600' }}
        run: |
          case "$RUTIS_S8_SECS" in ""|*[!0-9]*) echo "::error::host_soak_secs must be a number"; exit 1;; esac
          status=0
          cargo test -p rutis-e2e --test soak -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/soak-s8.txt" || status=$?
          {
            echo "### S8 host soak, ${{ matrix.os }}"
            echo
            grep -h '^soak-s8:' "$RUNNER_TEMP/soak-s8.txt" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            replay=$(sed -n 's/^soak-s8: replay: //p' "$RUNNER_TEMP/soak-s8.txt" | tail -1)
            echo "::error title=S8 host soak (${{ matrix.os }})::failed; replay: ${replay:-see the log}"
            {
              echo
              echo "Replay: \`${replay:-see the log}\`. The operations, the samples and every host's output are in the \`soak-s8-${{ matrix.os }}\` artifact (logs/)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      # The failed scenario's directory, without what is not read for a
      # diagnosis and that upload-artifact would follow or fail on (as in
      # ci.yml's e2e jobs).
      - name: prune the scenario directories
        if: failure()
        run: |
          [ -d "$RUTIS_E2E_DIR" ] || exit 0
          find "$RUTIS_E2E_DIR" \( -type l -o -type s -o -type p \) -delete
          find "$RUTIS_E2E_DIR" -type d \( -name node_modules -o -name .venv \) -prune -print |
            while IFS= read -r dir; do chmod -R u+w "$dir"; rm -rf "$dir"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-s8-${{ matrix.os }}
          path: ${{ env.RUTIS_E2E_DIR }}
          retention-days: 14
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted' && runner.os != 'Windows'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The shuttle models of the kernel (crates/rutis/src/fiber/shuttle_tests.rs:
  # TransitionTask wakeup, post_join against the driver's exit, concurrent
  # dispose), `shuttle_iterations` iterations of each scheduler per model.
  # A failure prints the failing schedule and seed; the log is uploaded.
  shuttle:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Run the shuttle models
        # bash -eo pipefail: a failing model fails the step through tee.
        shell: bash
        env:
          RUSTFLAGS: --cfg rutis_shuttle
          RUTIS_SHUTTLE_ITERATIONS: ${{ inputs.shuttle_iterations || '1000000' }}
        run: |
          case "$RUTIS_SHUTTLE_ITERATIONS" in ""|*[!0-9]*) echo "::error::shuttle_iterations must be a number"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/shuttle"
          cargo test -p rutis --lib --target-dir "${CARGO_TARGET_DIR:-target}/shuttle" shuttle 2>&1 | tee "$RUNNER_TEMP/shuttle/shuttle.txt"
          echo "shuttle: $RUTIS_SHUTTLE_ITERATIONS iterations of each scheduler per model, passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Say how to replay
        if: failure()
        run: |
          {
            echo "### shuttle models failed"
            echo
            echo "The failing schedule is in the log (\`failing schedule: \"…\"\`) and in the \`shuttle-log\` artifact. Replay it:"
            echo
            echo "\`RUTIS_SHUTTLE_REPLAY=<schedule> RUSTFLAGS=\"--cfg rutis_shuttle\" cargo test -p rutis --lib --target-dir target/shuttle <failing test>\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shuttle-log
          path: ${{ runner.temp }}/shuttle
          retention-days: 14
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The fuzz targets in fuzz/ (cargo-fuzz, nightly Rust), `fuzz_secs` each,
  # in parallel: session frames, the local line framing, WebSocket upgrade
  # requests. They start from the corpus checked in (fuzz/corpus/<target>);
  # what they add to it is not kept. A crash or a property that fails stops
  # the target; its input is uploaded with the log.
  fuzz:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [session_frame, local_lines, websocket_upgrade, error_graph]
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@nightly
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        # Outside the repository, whose rust-toolchain.toml would pick the
        # stable toolchain.
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz ${{ matrix.target }}
        shell: bash
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECS: ${{ inputs.fuzz_secs || '1200' }}
        run: |
          case "$FUZZ_SECS" in ""|*[!0-9]*) echo "::error::fuzz_secs must be a number"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/corpus" artifacts
          cargo +nightly fuzz build "$TARGET"
          # libFuzzer's progress goes to the log (uploaded on failure); its
          # end is printed. One input running over 10 s counts as a hang.
          status=0
          cargo +nightly fuzz run "$TARGET" "$RUNNER_TEMP/corpus" "corpus/$TARGET" -- \
            -max_total_time="$FUZZ_SECS" -timeout=10 -rss_limit_mb=2048 \
            > "artifacts/$TARGET.log" 2>&1 || status=$?
          tail -n 60 "artifacts/$TARGET.log"
          if [ "$status" -ne 0 ]; then
            echo "::error title=fuzz $TARGET::the target failed (exit status $status), see the log above"
            exit "$status"
          fi
          echo "fuzz $TARGET: $FUZZ_SECS s, $(grep -o 'Done [0-9]* runs' "artifacts/$TARGET.log" | tail -1), no failure" >> "$GITHUB_STEP_SUMMARY"
      - name: Say how to reproduce
        if: failure()
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### fuzz target $TARGET failed"
            echo
            echo "The input is in the \`fuzz-$TARGET\` artifact, with the log. Reproduce, in \`fuzz/\`:"
            echo
            for input in artifacts/"$TARGET"/*; do
              [ -e "$input" ] || continue
              echo "- \`cargo +nightly fuzz run $TARGET $input\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 14
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end
