# 常规 CI:PR 自动跑测试 + 编译检查;每晚(nightly.yml)、发布(release.yml)和手动运行跑全部任务。
# 防回归:任何改动(agent/cli/内核/bridge/rutis-dsh)引入的失败在此显式变红。
#
# Pull requests run only the jobs their change affects (docs/quality-status.md
# §8.3, Q12.3). Full runs (input `all`) run every job: nightly.yml calls this
# workflow every night main has new commits, release.yml calls it in the
# release gate, and a run by hand (Actions → ci → Run workflow, any
# branch) is one too. A merge to main runs nothing. The
# `changes` job decides, and `ci-ok` is the one check a merge waits for
# (Q12.5).
#
# rutis-agent 的 rutui 依赖已从 crates.io 解析,无需额外 checkout。

name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      all:
        description: Run every job (false runs only `changes` and `ci-ok`)
        type: boolean
        default: true
      base:
        description: The commit the links check compares with (default the parent commit)
        type: string
        default: ""
      specs:
        description: Run the TLA+ specs (nightly skips them unless specs/** changed or this is the weekly run)
        type: boolean
        default: true
      sdk_repro:
        description: Run the two-runner SDK reproducibility checks (nightly skips them unless the SDK changed or this is the weekly run)
        type: boolean
        default: true
  workflow_call:
    inputs:
      all:
        description: Run every job (nightly.yml, release.yml)
        type: boolean
        default: false
      base:
        description: The commit the links check compares with (default the parent commit)
        type: string
        default: ""
      release:
        description: Called by release.yml, the release gate (the cross-version meetings leave out the version being released)
        type: boolean
        default: false
      specs:
        description: Run the TLA+ specs (nightly skips them unless specs/** changed or this is the weekly run)
        type: boolean
        default: true
      sdk_repro:
        description: Run the two-runner SDK reproducibility checks (nightly skips them unless the SDK changed or this is the weekly run)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The test files that do not depend on the platform: in-memory channels,
  # nothing started, no socket, no file but fixtures read, nothing of the OS
  # (Rust code only, the same everywhere). Pull requests skip these and the
  # MACOS/WINDOWS_SKIP_TESTS_* lists below on macOS and Windows, and run every
  # other test file of the crate there, with its unit tests
  # (tools/platform-tests.sh builds the cargo test flags); Linux runs every
  # test, and full runs run every test everywhere. A new test file therefore
  # runs on every platform unless it is added to one of these lists, and only
  # a test that starts nothing and opens nothing belongs in PURE_TESTS_*. A
  # name here without its file fails the `lint` job.
  PURE_TESTS_BRIDGE: >-
    link memory_mux memory_plugin memory_session multihop node
    node_conformance
  PURE_TESTS_LOADER: >-
    check instance_peers instance_services instances lifecycle loader
    migration_example overlay patch_parity peer_rows regressions scope
  # What the pull-request jobs on macOS and Windows skip besides PURE_TESTS_*:
  # tests of runtime and event behavior that is the same on Linux, where the
  # `rust` job runs them with every runtime's features. What is platform
  # specific stays: process start, inherited sockets and loopback handover,
  # signals, the network stack, and the Swift and Kotlin rows of their own
  # platforms. Full runs run every test file on every platform. Unlike
  # PURE_TESTS_*, multiprocess still repeats these (they start processes).
  # The two platforms differ: Windows keeps the runtime rows that start
  # through loopback, and skips the rows of runtimes it does not run.
  MACOS_SKIP_TESTS_BRIDGE: >-
    dsh_baseline event_hub events_expected go_runtime kotlin_runtime
    marked_services python_runtime runtime_conformance swift_runtime
    value_roundtrip
  MACOS_SKIP_TESTS_LOADER: >-
    events_conformance events_nodes go_rows go_stop instance_go leases
    marked_services multilang_go runtime_instances runtime_rows sync_cycles
  WINDOWS_SKIP_TESTS_BRIDGE: >-
    dsh_baseline event_hub events_expected go_runtime kotlin_runtime
    marked_services python_runtime runtime_conformance swift_runtime
    value_roundtrip
  WINDOWS_SKIP_TESTS_LOADER: >-
    bun_instances bun_multilang bun_rows events_conformance events_nodes
    multilang_swift swift_rows
  # The jobs only build to run the tests and checks, and none reads a
  # backtrace: leaving debug info out of the dev and test profiles keeps the
  # target directories (and Swatinem/rust-cache's archives) smaller and the
  # links shorter. Release builds already set `debug = 0` in Cargo.toml.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# A new push to a pull request cancels its run still in progress (Q12.4).
# Other runs (by hand, or called by nightly.yml or release.yml, where
# github.run_id is the caller's) each have a group of their own: they are
# never cancelled or held back by another run, and a called run never waits
# on its caller.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches. The mapping from paths to jobs is reviewed like
  # code; a job skipped on a pull request that then fails in a full run
  # (nightly) means a path is missing here (Q12.3.3). Without a pull request
  # the input `all` decides: every job, or none.
  #
  # This job and ci-ok only orchestrate: they run on GitHub's Linux, not on
  # the self-hosted macOS runners, whose slots the platform tests need
  # (docs/ci.md §10); the repository variable GATE_RUNNER (JSON) switches
  # them, e.g. to '["self-hosted","macOS","ARM64"]'.
  changes:
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.select.outputs.all }}
      code: ${{ steps.select.outputs.code }}
      dylib: ${{ steps.select.outputs.dylib }}
      packaging: ${{ steps.select.outputs.packaging }}
      docs: ${{ steps.select.outputs.docs }}
      bun: ${{ steps.select.outputs.bun }}
      bun-matrix: ${{ steps.select.outputs.bun-matrix }}
      go: ${{ steps.select.outputs.go }}
      go-matrix: ${{ steps.select.outputs.go-matrix }}
      kotlin: ${{ steps.select.outputs.kotlin }}
      swift: ${{ steps.select.outputs.swift }}
      repro: ${{ steps.select.outputs.repro }}
      specs: ${{ steps.select.outputs.specs }}
      sdk_repro: ${{ steps.select.outputs.sdk_repro }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: paths
        with:
          filters: |
            # Changes whose reach cannot be told run everything (Q12.3.2,
            # Q12.10).
            all:
              - Cargo.lock
              - Cargo.toml
              - rust-toolchain.toml
              - .github/workflows/**
            # The dylib crates, their tools and fixtures, and the files of
            # rutis-cli that link the SDK and hold the dylib host tests. Its
            # documentation and license do not reach the SDK. Kernel changes
            # reach the SDK too, but full runs run the dylib jobs after them
            # (Q12.1): kernel pull requests would otherwise wait 20 minutes
            # on jobs that have not failed in 88 runs.
            dylib:
              - crates/rutis-cli/build.rs
              - crates/rutis-cli/src/**
              - crates/rutis-cli/Cargo.toml
              - crates/rutis-dylib/**
              - crates/rutis-dylib-meta/**
              - crates/rutis-dylib-launcher/**
              - crates/rutis-sdk/**
              - crates/rutis-dev/**
              - crates/rutis-xtask/**
              - tools/*dylib*
              - tools/build-dylib-bundle.sh
              - tools/test-sdk-bundle.sh
              - tools/lib/**
              - tests/dylib-fixtures/**
            # What release.yml packages.
            packaging:
              - scripts/train.mjs
              - '**/pyproject.toml'
              - '**/package.json'
              - crates/*/Cargo.toml
              - node/rutis-host/scripts/**
            docs:
              - '**/*.md'
            # Guides whose Rust examples are doctests (crates/rutis and
            # crates/rutis-loader include them): they run the Rust tests as
            # code does, though `code` leaves out Markdown.
            doctested:
              - docs/guide/rust-plugin*.md
              - docs/guide/rust-host*.md
            # The Bun runtime, and the Rust crates that start and run it.
            bun:
              - bun/**
              - node/rutis/**
              - crates/rutis-bridge/**
              - crates/rutis-loader/**
              - crates/rutis-host/**
            # The Go runtime and SDK, and the Rust crates that start and run it.
            go:
              - go/**
              - crates/rutis-bridge/**
              - crates/rutis-loader/**
              - crates/rutis-host/**
            # The Kotlin SDK, and the Rust crates whose conformance suites
            # run it, and rutis-host, whose remote runtimes it is.
            kotlin:
              - kotlin/**
              - crates/rutis-bridge/**
              - crates/rutis-loader/**
              - crates/rutis-host/**
            # The Swift SDK (the root Package.swift and swift/), the Swift
            # runtime's own sources, and the test files that run it. Changes
            # to the other bridge, loader and host sources reach Swift too,
            # but a Swift-only break there is found by the nightly full run
            # (Q12.1): 6–7 minutes of macOS per bridge change otherwise, and
            # Linux runs those suites.
            swift:
              - Package.swift
              - swift/**
              - crates/rutis-bridge/tests/swift_remote.rs
              - crates/rutis-bridge/tests/swift_runtime.rs
              - crates/rutis-loader/src/runtime/swift.rs
              - crates/rutis-loader/tests/swift_rows.rs
              - crates/rutis-loader/tests/multilang_swift.rs
              - crates/rutis-loader/tests/objects_cross.rs
              - crates/rutis-loader/tests/plugin_values.rs
              - crates/rutis-host/src/languages/swift.rs
              - crates/rutis-host/tests/swift.rs
              - crates/rutis-host/tests/swift_app.rs
              - tests/e2e/tests/dev_loop.rs
            # What decides whether the SDK builds reproducibly. Kernel
            # changes reach the SDK too, but are checked in full runs
            # (Q12.6.3).
            repro:
              - crates/rutis-sdk/**
              - crates/rutis-cli/build.rs
              - tools/test-dylib-repro.sh
              - tools/build-dylib-bundle.sh
              - tools/lib/**
            # The TLA+ models (their READMEs too: they state the results).
            specs:
              - specs/**
      # Anything that is not documentation (every pattern must match).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: code
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      - id: select
        env:
          # The input (workflow_dispatch, workflow_call); empty on a pull
          # request.
          FULL: ${{ inputs.all }}
          ALL: ${{ steps.paths.outputs.all }}
          CODE: ${{ steps.code.outputs.code }}
          DOCTESTED: ${{ steps.paths.outputs.doctested }}
          DYLIB: ${{ steps.paths.outputs.dylib }}
          PACKAGING: ${{ steps.paths.outputs.packaging }}
          DOCS: ${{ steps.paths.outputs.docs }}
          BUN: ${{ steps.paths.outputs.bun }}
          GO: ${{ steps.paths.outputs.go }}
          KOTLIN: ${{ steps.paths.outputs.kotlin }}
          SWIFT: ${{ steps.paths.outputs.swift }}
          REPRO: ${{ steps.paths.outputs.repro }}
          SPECS: ${{ steps.paths.outputs.specs }}
          # Nightly turns these off unless the paths changed or it is the
          # weekly run (nightly.yml). Pull requests: specs follows its paths;
          # sdk-repro stays in full runs.
          SPECS_INPUT: ${{ inputs.specs }}
          SDK_REPRO_INPUT: ${{ inputs.sdk_repro }}
          # JSON, as runs-on takes it.
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER || '"ubuntu-24.04"' }}
          MACOS_RUNNER: ${{ vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]' }}
        run: |
          LINUX=$(jq -c . <<< "$LINUX_RUNNER")
          MACOS=$(jq -c . <<< "$MACOS_RUNNER")
          all=false
          if [ "$FULL" = true ] || [ "$ALL" = true ]; then all=true; fi
          pick() { if [ "$all" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          # In a full run these default on; nightly turns them off unless its
          # paths changed or it is the weekly run.
          specs=$(pick "$SPECS")
          if [ "$all" = true ] && [ "$SPECS_INPUT" = false ]; then specs=false; fi
          sdk_repro=false
          if [ "$all" = true ] && [ "$SDK_REPRO_INPUT" != false ]; then sdk_repro=true; fi
          # A doctested guide is code for the Rust jobs.
          code=$CODE
          if [ "$DOCTESTED" = true ]; then code=true; fi
          {
            echo "all=$all"
            echo "code=$(pick "$code")"
            echo "dylib=$(pick "$DYLIB")"
            echo "packaging=$(pick "$PACKAGING")"
            echo "docs=$(pick "$DOCS")"
            echo "bun=$(pick "$BUN")"
            echo "repro=$(pick "$REPRO")"
            echo "go=$(pick "$GO")"
            echo "kotlin=$(pick "$KOTLIN")"
            echo "swift=$(pick "$SWIFT")"
            echo "specs=$specs"
            echo "sdk_repro=$sdk_repro"
            # Pull requests: the oldest supported Bun and Go, on Linux only
            # (the minimum must be verified; network-macos runs the latest).
            # Full runs: also the latest on Linux and the oldest on macOS.
            # The Linux entries run where the other Linux jobs do (LINUX_RUNNER),
            # the macOS entries where the other macOS jobs do (MACOS_RUNNER).
            if [ "$all" = true ]; then
              echo "bun-matrix=[{\"os\":$LINUX,\"bun\":\"1.4.0\"},{\"os\":$LINUX,\"bun\":\"latest\"},{\"os\":$MACOS,\"bun\":\"1.4.0\"}]"
              echo "go-matrix=[{\"os\":$LINUX,\"go\":\"oldstable\"},{\"os\":$LINUX,\"go\":\"stable\"},{\"os\":$MACOS,\"go\":\"oldstable\"}]"
            else
              echo "bun-matrix=[{\"os\":$LINUX,\"bun\":\"1.4.0\"}]"
              echo "go-matrix=[{\"os\":$LINUX,\"go\":\"oldstable\"}]"
            fi
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  # Relative links in Markdown resolve. Links already broken on the base
  # commit (old notes pointing at moved files) are listed, not failed.
  #
  # Every pull request runs it, not only the documentation ones: renaming or
  # removing a file a note points at breaks the links too, and the check is
  # cheap on Linux (docs/ci.md §10).
  links:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      # A self-hosted runner has no Node of its own.
      - uses: actions/setup-node@v4
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'
      # Compared with the pull request's base, the input `base` (nightly.yml:
      # its last successful run's commit), or else this commit's parent.
      - name: relative Markdown links
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          if [ -z "$BASE" ] && git fetch --quiet --depth=2 origin "$GITHUB_SHA"; then
            BASE=$(git rev-parse --verify --quiet HEAD^ || true)
          fi
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE"; then
            node tools/check-md-links.mjs --base "$BASE"
          else
            node tools/check-md-links.mjs
          fi
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The Linux tests of an ordinary change, in parallel jobs so that the
  # longest one sets the time (Q12.6.1): `rust` (every Rust test once, but the
  # end-to-end scenarios), `e2e` (the scenarios), `js-py` (the Node and Python
  # packages), and `checks` (compile checks of
  # feature combinations: in full runs and for changes that run everything, as
  # they catch rare errors and run no tests). `js-py`, `checks` and `msrv`
  # do not depend on the OS and run on the self-hosted macOS runners
  # (docs/ci.md §10); `checks` and `msrv` there skip Linux-only cfg code,
  # which `lint` (clippy, Linux) compiles.
  #
  # Versions: the oldest each package supports, so that the minimum is
  # verified; network-macos runs the newest.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    # About 14 minutes on a pull request with events_conformance sampled
    # (2026-10-19), of which events_conformance took about 6.5; pull
    # requests now run its written placements. The step "job time" writes
    # each run's to the summary.
    timeout-minutes: 60
    steps:
      - name: job time, start
        run: echo "RUTIS_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start

      # rutui 已发布 crates.io(rutis-agent 走 version 依赖,与其他外部
      # 依赖同构);hack 本地 rutui 时按惯例在工作区根加未提交的 [patch]。

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          # Saved on main only (the nightly runs): pull requests read main's
          # caches, and their own would crowd main's out of the repository's
          # 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The oldest Node the packages support (engines.node).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            node/rutis-runtime/package-lock.json
            node/baseline/package-lock.json
            crates/rutis-dsh/dsh/package-lock.json
      # The Node runtime the Rust tests start.
      - run: npm --prefix node/rutis-runtime ci
      # Real published Cordis plugins for the Cordis mount baseline test
      # (rutis-bridge dsh_baseline).
      - run: npm --prefix node/baseline ci
      # dsh, for rutis-dsh's web tests (built only when it is installed).
      - run: npm --prefix crates/rutis-dsh/dsh ci
      # The oldest Bun (node/rutis engines.bun); runtimes-bun has the rest.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # The oldest Python (requires-python) and the
      # oldest websockets (rutis[network]).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install "websockets==15.*"
      # The older of the two Go releases supported.
      - uses: actions/setup-go@v5
        with:
          go-version: oldstable
          cache-dependency-path: go/rutis/go.mod
      # Delve, which `rutis-host dev --debug` runs a Go project under
      # (rutis-host/tests/debug.rs). A version that supports oldstable Go;
      # move it on when a Go release needs a newer one. Retried, as
      # downloads are.
      - name: Delve
        run: |
          for attempt in 1 2 3; do
            go install github.com/go-delve/delve/cmd/dlv@v1.27.2 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The Kotlin SDK's jvm target (JDK 17): the bridge's tests with the
      # feature `kotlin` start its conformance jar, built once here
      # (RUTIS_KOTLIN_JAR); runtimes-kotlin has the rest.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: the Kotlin conformance jar
        working-directory: kotlin/rutis
        run: |
          # Retried: a download that fails halfway (the runners' networks)
          # should not fail the job.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --quiet :rutis-conformance:fatJar && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          echo "RUTIS_KOTLIN_JAR=$PWD/rutis-conformance/build/libs/rutis-conformance-all.jar" >> "$GITHUB_ENV"

      # rutis-bridge and rutis-loader run once each, below, with all their
      # features (Q12.7); the end-to-end scenarios run in `e2e`.
      - name: cargo test (workspace but rutis-bridge, rutis-loader and rutis-e2e)
        env:
          # The Go debugging test fails instead of skipping without dlv.
          RUTIS_TEST_DELVE: required
        run: cargo test --workspace --exclude rutis-bridge --exclude rutis-loader --exclude rutis-e2e
      # The `anyhow` feature's conversions (the error table of #617).
      - name: cargo test (rutis, anyhow feature)
        run: cargo test -p rutis --features anyhow --test author_api

      # The shuttle models of the kernel (crates/rutis/src/fiber/shuttle_tests.rs,
      # #179), 1000 iterations of each scheduler (well under a second); the
      # nightly stress.yml runs a million. Built with --cfg rutis_shuttle in
      # a target directory of its own, so the flag rebuilds nothing else.
      - name: cargo test (rutis shuttle models)
        env:
          RUSTFLAGS: --cfg rutis_shuttle
        run: cargo test -p rutis --lib --target-dir "${CARGO_TARGET_DIR:-target}/shuttle" shuttle

      # The fuzz entry points (crates/rutis-bridge/src/fuzzing.rs, #179)
      # compile only under cargo-fuzz's --cfg fuzzing, which the nightly
      # stress.yml uses: checked here (no run), in a target directory of
      # its own, so that a change breaking them fails the pull request.
      - name: cargo check (rutis-bridge fuzz entry points)
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check -p rutis-bridge --features websocket --target-dir "${CARGO_TARGET_DIR:-target}/fuzzcheck"

      # The fuzz targets themselves (fuzz/, its own workspace): a change
      # there used to break only the nightly stress.yml, which compiles them
      # with cargo-fuzz. Same flags and target directory as the entry points.
      - name: cargo check (fuzz targets)
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --manifest-path fuzz/Cargo.toml --target-dir "${CARGO_TARGET_DIR:-target}/fuzzcheck"

      # Plugins of other languages and of other nodes as rutis-loader rows,
      # and the unified events conformance suite (events_conformance), which
      # runs one test at a time and must find every runtime language. Its
      # placements: the written ones on pull requests, a sample of them in
      # full runs (about 900 per language, some 6 minutes more); the
      # nightly stress.yml `events-all` runs all of them.
      - name: cargo test (rutis-loader, every row kind)
        env:
          RUTIS_EVENTS_PLACEMENTS: ${{ needs.changes.outputs.all == 'true' && 'sampled' || 'written' }}
          RUTIS_EVENTS_REQUIRE: node,python,go,bun
          RUTIS_EVENTS_SETTLE_SCALE: '2'
        run: cargo test -p rutis-loader --features node,python,go,bun,peer

      # Both runtimes, every transport, and the conformance suites.
      - name: cargo test (rutis-bridge, all features)
        run: cargo test -p rutis-bridge --all-features

      # The same rows with the runtimes started as on Windows: a loopback
      # channel and a one-time token instead of an inherited socket. Pull
      # requests run these tests in runtimes-windows, where loopback is how
      # processes start; full runs also run them here.
      - name: cargo test (rutis-loader runtimes, loopback channels)
        if: needs.changes.outputs.all == 'true'
        env:
          RUTIS_LOCAL_HANDOVER: loopback
          RUTIS_EVENTS_PLACEMENTS: written
          RUTIS_EVENTS_REQUIRE: node,python,go,bun
          RUTIS_EVENTS_SETTLE_SCALE: '2'
        run: cargo test -p rutis-loader --features node,python,go,bun,peer --test runtime_rows --test python_rows --test multilang --test leases --test instance_runtimes --test go_rows --test go_stop --test multilang_go --test instance_go --test sync_cycles --test events_conformance
      - name: job time
        if: always()
        run: echo "rust job, $(( ($(date +%s) - RUTIS_JOB_STARTED) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The end-to-end scenarios (tests/e2e): real rutis-host processes on
  # project directories, with probe plugins of every language. In parallel
  # with `rust`, on the same oldest versions; network-macos runs them on the
  # latest. The install scenarios (ignored here) run in install.yml.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    env:
      # Short, for the Unix socket paths under it (tests/e2e/src/lib.rs).
      RUTIS_E2E_DIR: /tmp/rutis-e2e
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The oldest Node (engines.node) and the Node runtime the host starts.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            node/rutis-runtime/package-lock.json
            node/baseline/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      # The published Cordis plugins S6 mounts (tests/e2e/tests/cordis.rs),
      # at the lockfile's versions.
      - run: npm --prefix node/baseline ci
      # The oldest Bun (engines.bun).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # The oldest Python (requires-python) and the oldest websockets
      # (rutis[network]); the scenarios use the checkout's python/rutis.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install "websockets==15.*"
      # The older of the two Go releases supported.
      - uses: actions/setup-go@v5
        with:
          go-version: oldstable
          cache-dependency-path: go/rutis/go.mod
      - name: cargo test (end-to-end scenarios)
        env:
          # S7's tenants created and closed (tests/e2e/tests/embedding.rs):
          # 20 on pull requests, 3000 in full runs (nightly), about a
          # minute more.
          RUTIS_E2E_TENANT_CYCLES: ${{ github.event_name == 'pull_request' && '20' || '3000' }}
        run: cargo test -p rutis-e2e
      # The published releases meeting this code (#209). They come from
      # npm, PyPI and the Go proxy and change as releases are published,
      # so only full runs (nightly, release gate) run them (docs/ci.md §2).
      # Installed outside target/: not into the Rust cache. Which releases
      # it met goes to the job summary (tests/e2e/src/previous.rs). In the
      # release gate, only older releases: a release re-run after it failed
      # halfway may find its own version published in part.
      - name: cargo test (cross-version meetings)
        if: needs.changes.outputs.all == 'true'
        env:
          RUTIS_E2E_CACHE: ${{ runner.temp }}/rutis-e2e-previous
          RUTIS_E2E_ONLY_OLDER: ${{ inputs.release && '1' || '' }}
        run: cargo test -p rutis-e2e --test cross_version -- --ignored
      # A failed scenario keeps its directory, with every host's output and
      # the residue found in logs/.
      # The failed scenarios' directories, without what is not read for a
      # diagnosis and that upload-artifact would follow or fail on: links
      # into the checkout, sockets, installed packages and caches.
      - name: prune the scenario directories
        if: failure()
        run: |
          [ -d "$RUTIS_E2E_DIR" ] || exit 0
          find "$RUTIS_E2E_DIR" \( -type l -o -type s -o -type p \) -delete
          find "$RUTIS_E2E_DIR" -type d \( -name node_modules -o -name .venv -o -name .npm -o -name .uv -o -path '*/home/go' \) -prune -print |
            while IFS= read -r dir; do chmod -R u+w "$dir"; rm -rf "$dir"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-linux
          path: ${{ env.RUTIS_E2E_DIR }}
          retention-days: 14
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  js-py:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      # The oldest Node the packages support (engines.node).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            node/rutis-runtime/package-lock.json
            crates/rutis-dsh/dsh/package-lock.json
      # The release train: one version for every package released together.
      - run: node scripts/train.mjs
      # The SDK has no dependencies: `ci` only checks its lockfile.
      - run: npm --prefix node/rutis ci
      - run: npm --prefix node/rutis test
      - run: npm --prefix node/rutis-runtime ci
      - run: npm --prefix node/rutis-runtime test
      - run: npm --prefix node/rutis-host test
      # dsh (web UI and agent loop) served by aimux in the rutis-dsh host.
      - run: npm --prefix crates/rutis-dsh/dsh ci
      - run: npm --prefix crates/rutis-dsh/dsh test
      # The Python package on the oldest Python (requires-python) and
      # the oldest websockets.
      # setup-python's macOS builds install only under /Users/runner: a
      # self-hosted runner takes uv's Python 3.10, in a virtual environment
      # with pip.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted'
      - name: Python 3.10 (self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: |
          uv python install 3.10
          uv venv --seed --python-preference only-managed --python 3.10 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      # WebSocket channels of the Python runtime (rutis[network]).
      - run: python3 -m pip install "websockets==15.*"
      - run: python3 -m unittest discover -s tests
        working-directory: python/rutis
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # fmt and clippy, in parallel with the tests (not on the critical path).
  # clippy compiles the whole workspace with all features, so `checks` does
  # not repeat a plain `cargo check`. Warnings fail the job; there is no
  # baseline (#204).
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Plugin guides and examples use the author and host layers only; the
      # hidden `rutis::internal` is for rutis's own crates (#617).
      - name: no rutis::internal in the guides and examples
        run: |
          if grep -rn "rutis::internal" docs/guide README.md README.zh-CN.md examples crates/rutis/examples crates/aimux-llm; then
            echo "::error::guides and examples must not use rutis::internal" >&2
            exit 1
          fi
      # Every name in the test lists at the top of this file is a test file:
      # a rename must not leave a stale name behind.
      - name: the platform test lists
        run: |
          bash tools/platform-tests.sh crates/rutis-bridge $PURE_TESTS_BRIDGE
          bash tools/platform-tests.sh crates/rutis-loader $PURE_TESTS_LOADER
          bash tools/platform-tests.sh crates/rutis-bridge $MACOS_SKIP_TESTS_BRIDGE
          bash tools/platform-tests.sh crates/rutis-loader $MACOS_SKIP_TESTS_LOADER
          bash tools/platform-tests.sh crates/rutis-bridge $WINDOWS_SKIP_TESTS_BRIDGE
          bash tools/platform-tests.sh crates/rutis-loader $WINDOWS_SKIP_TESTS_LOADER
      # The examples' build scripts need the Node runtime, and rutis-dsh
      # compiles its web host only when dsh is installed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            node/rutis-runtime/package-lock.json
            crates/rutis-dsh/dsh/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      - run: npm --prefix crates/rutis-dsh/dsh ci
      # `--all-features` turns on the dylib fixtures' `export` feature, which
      # reads the SDK artifact hash at compile time (as in sdk-repro).
      - name: cargo clippy
        run: |
          export RUTIS_SDK_ARTIFACT_SHA256="$(printf '0%.0s' {1..64})"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The kernel's public API (its root, rutis::events and rutis::host) against
  # the snapshot in crates/rutis/public-api.txt (tools/public-api.sh, #617):
  # a new name shows in review as a change to the snapshot. The listing is
  # built from the cargo-public-api libraries (tools/public-api), not its
  # CLI: that has no prebuilt binary and needs OpenSSL's headers and
  # pkg-config to build, which a runner may lack.
  public-api:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml's, which builds tools/public-api.
      - uses: dtolnay/rust-toolchain@1.98.1
      # The one that writes the rustdoc JSON.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - name: public API snapshot
        env:
          RUTIS_PUBLIC_API_TOOLCHAIN: nightly-2026-10-16
        run: bash tools/public-api.sh

  # The declared MSRV (rust-version in Cargo.toml) builds the libraries and
  # binaries, with our Cargo.lock (Q10.3). With `all`: in full runs, and on pull
  # requests that change Cargo.lock or Cargo.toml, which is how a dependency
  # that needs a newer rustc arrives. rutis-agent and rutis-cli are examples
  # and declare no MSRV.
  msrv:
    needs: changes
    if: needs.changes.outputs.all == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.88
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The examples' build scripts need the Node runtime (as in lint).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: node/rutis-runtime/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      - name: cargo +1.88 check
        run: cargo +1.88 check --workspace --exclude rutis-agent --exclude rutis-cli --locked
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  checks:
    needs: changes
    if: needs.changes.outputs.all == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rutis-dsh compiles its web host only when dsh is installed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            node/rutis-runtime/package-lock.json
            crates/rutis-dsh/dsh/package-lock.json
      - run: npm --prefix node/rutis-runtime ci
      - run: npm --prefix crates/rutis-dsh/dsh ci

      # An application compiles only the parts it enables.
      - name: cargo check (feature sets)
        run: |
          cargo check -p rutis-bridge --no-default-features --all-targets
          cargo check -p rutis-bridge --no-default-features --features python --all-targets
          cargo check -p rutis-bridge --no-default-features --features websocket --all-targets
          cargo check -p rutis-bridge --no-default-features --features bun --all-targets
          cargo check -p rutis-bridge --no-default-features --features go --all-targets
          cargo check -p rutis-bridge --features cordis --all-targets
          cargo check -p rutis-loader --features node --all-targets
          cargo check -p rutis-loader --features python --all-targets
          cargo check -p rutis-loader --no-default-features --features bun --all-targets
          cargo check -p rutis-loader --features go --all-targets
          cargo check -p rutis-loader --features peer --all-targets

      # The loader test targets compile under each single feature.
      - name: cargo test --no-run (rutis-loader, node)
        run: cargo test -p rutis-loader --features node --no-run

      - name: cargo test --no-run (rutis-loader, python)
        run: cargo test -p rutis-loader --features python --no-run

      - name: cargo test --no-run (rutis-loader, peer)
        run: cargo test -p rutis-loader --features peer --no-run

      - name: cargo test --no-run (rutis-loader, go)
        run: cargo test -p rutis-loader --features go --no-run
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The Go SDK and runtime: the SDK's own tests (race detector on), then
  # the Go runtime against the conformance suites, the loader's Go rows and
  # rutis-host. Pull requests: oldstable (the older of the two supported
  # releases) on Linux; full runs add stable on Linux and oldstable on macOS
  # (`go-matrix`); network-macos and runtimes-windows run stable.
  runtimes-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The caches of setup-go only on hosted runners: a self-hosted runner
      # keeps its own, and restoring over it fails.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go/rutis/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix node/rutis-runtime ci
      # setup-python's macOS builds install only under /Users/runner (the
      # hosted image's user): the self-hosted Macs take uv's Python 3.10, in
      # a virtual environment with pip (as js-py).
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted' || runner.os != 'macOS'
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      - name: Python 3.10 (self-hosted macOS)
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          uv python install 3.10
          uv venv --seed --python-preference only-managed --python 3.10 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install "websockets==15.*"
      - name: gofmt
        run: test -z "$(gofmt -l go crates/rutis-loader/tests/fixtures/go)"
      - name: go vet and test (SDK, fixtures)
        run: |
          (cd go/rutis && go vet ./... && go test -race ./...)
          (cd crates/rutis-loader/tests/fixtures/go && go vet ./...)
      # rust runs the bridge and loader suites with every runtime's features
      # on Linux; these three repeat parts of them for the Go runtime, so
      # pull requests leave them to the full runs (Q12.7).
      - name: cargo test (the Go runtime in the bridge)
        if: needs.changes.outputs.all == 'true'
        run: cargo test -p rutis-bridge --features testing,go --test go_runtime --test host_gone
      # Only the Go tests of the contract suites: the other runtimes run in
      # their own jobs.
      - name: cargo test (the contract suites with Go)
        if: needs.changes.outputs.all == 'true'
        run: cargo test -p rutis-bridge --features testing,websocket,go --test session_matrix --test runtime_conformance go_
      - name: cargo test (Go rows)
        if: needs.changes.outputs.all == 'true'
        run: cargo test -p rutis-loader --features node,python,go --test go_rows --test go_stop --test multilang_go --test instance_go --test leases
      # Pull requests run these rows on Windows (runtimes-windows), where
      # loopback is how processes start; full runs also run them here.
      - name: cargo test (Go rows on loopback channels)
        if: needs.changes.outputs.all == 'true'
        env:
          RUTIS_LOCAL_HANDOVER: loopback
        run: cargo test -p rutis-loader --features node,python,go --test go_rows --test go_stop --test multilang_go --test instance_go
      # Only rutis-host's Go tests: the other runtimes run in their own jobs.
      - name: cargo test (rutis-host, Go)
        run: cargo test -p rutis-host go
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The Kotlin SDK (kotlin/rutis, docs/design-android-runtime-2026-10-12.md
  # K-P1): its Gradle build and tests on JDK 17 (the jvm target; the
  # android target and its AAR where the runner has an Android SDK), then
  # the Rust conformance suites with the Kotlin session and runtime
  # (feature `kotlin`), Gradle before cargo.
  runtimes-kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The caches of setup-java only on hosted runners: a self-hosted
      # runner keeps its own Gradle home.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}
          cache-dependency-path: kotlin/rutis/**/*.gradle.kts
      - name: gradle build (the SDK, the processor, the testing tool, the conformance programs)
        working-directory: kotlin/rutis
        run: |
          # The downloads first, retried (the runners' networks); then the
          # build and its tests, once.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --quiet :rutis-conformance:fatJar && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          ./gradlew --no-daemon build
          echo "RUTIS_KOTLIN_JAR=$PWD/rutis-conformance/build/libs/rutis-conformance-all.jar" >> "$GITHUB_ENV"
      # The other languages, as the far ends of the events conformance.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix node/rutis-runtime ci
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted' || runner.os != 'macOS'
        with:
          python-version: '3.10'
      - run: python3 -m pip install "websockets==15.*"
      # Only the Kotlin tests of the contract suites: the other runtimes run
      # in their own jobs.
      - name: cargo test (the contract suites with Kotlin)
        run: |
          cargo test -p rutis-bridge --features testing,websocket,kotlin --test runtime_conformance --test value_roundtrip --test session_matrix kotlin_
          cargo test -p rutis-bridge --features testing,kotlin --test kotlin_runtime
      # Remote: the dial-out column, the listener's and dialer's own rules
      # (statuses, frames, heartbeat, takeover, TLS both ways), and
      # rutis-host's `runtimes.remote[].language: "kotlin"`.
      - name: cargo test (the Kotlin runtime remotely)
        run: |
          cargo test -p rutis-bridge --features testing,websocket,kotlin --test dial_conformance kotlin::
          cargo test -p rutis-bridge --features testing,websocket,kotlin --test kotlin_remote
          cargo test -p rutis-host --features kotlin --test kotlin
      # Kotlin rows among Node and Python ones (the multilang Kotlin column),
      # and their plugin definitions handed to Rust, from rows and from an
      # app that dials in (the plugin-values Kotlin column).
      - name: cargo test (Kotlin rows)
        run: |
          cargo test -p rutis-loader --features node,python,kotlin --test multilang_kotlin
          cargo test -p rutis-loader --features node,python,kotlin --test objects_cross kotlin
          cargo test -p rutis-loader --features kotlin --test plugin_values kotlin
      # The events conformance with X Kotlin, and Kotlin as Y of the others
      # (the written placements on pull requests, a sample in full runs).
      - name: cargo test (events conformance with Kotlin)
        env:
          RUTIS_EVENTS_PLACEMENTS: ${{ needs.changes.outputs.all == 'true' && 'sampled' || 'written' }}
          RUTIS_EVENTS_REQUIRE: node,python,kotlin
          RUTIS_EVENTS_SETTLE_SCALE: '2'
        run: cargo test -p rutis-loader --features node,python,kotlin --test events_conformance
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The Swift SDK (swift/rutis, the root Package.swift): its own tests,
  # the library built for iOS where the runner has the iOS SDK, and the Rust
  # tests that run its session and runtimes. macOS only (design §13), on the
  # self-hosted Macs (MACOS_RUNNER) with their Xcode.
  runtimes-swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Swift toolchain
        run: swift --version
      # The SDK's own tests run as a program (swift/rutis/Tests/SelfTest):
      # the runners' Command Line Tools have no XCTest, and not every
      # version has Swift Testing's macros.
      - name: swift build and the SDK's tests
        run: |
          swift build
          swift run RutisSelfTest
      # The library for iOS (design §13: its core is iOS too), when this
      # toolchain has the iOS SDK (Xcode).
      - name: iOS build of the library
        run: |
          if sdk=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null); then
            swift build --target Rutis --triple arm64-apple-ios17.0 --sdk "$sdk" --build-path .build/ios
            swift build --target RutisTest --triple arm64-apple-ios17.0 --sdk "$sdk" --build-path .build/ios
          else
            echo "no iOS SDK on this runner: skipped"
          fi
      # Only the Swift tests of the contract suites: the other runtimes run
      # in their own jobs.
      - name: cargo test (the contract suites with Swift)
        run: cargo test -p rutis-bridge --features testing,websocket,swift --test runtime_conformance --test value_roundtrip --test session_matrix swift_
      # Remote: the dial-out column, and the listener's and dialer's own
      # rules (statuses, frames, heartbeat, takeover, TLS both ways).
      - name: cargo test (the Swift runtime remotely)
        run: |
          cargo test -p rutis-bridge --features testing,websocket,swift --test dial_conformance swift::
          cargo test -p rutis-bridge --features testing,websocket,swift --test swift_remote
      - name: cargo test (the Swift runtime in the bridge)
        run: cargo test -p rutis-bridge --features testing,swift --test swift_runtime
      # Swift rows beside Node and Python ones: their runtimes too.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix node/rutis-runtime ci
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted'
      - name: Python 3.10 (self-hosted macOS)
        if: runner.environment == 'self-hosted'
        run: |
          uv python install 3.10
          uv venv --seed --python-preference only-managed --python 3.10 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.10'
      - name: cargo test (Swift rows)
        run: |
          cargo test -p rutis-loader --features node,python,swift --test swift_rows --test multilang_swift
          cargo test -p rutis-loader --features node,python,swift --test caller_rows --test sync_cycles swift
          cargo test -p rutis-loader --features node,python,swift --test objects_cross swift
          cargo test -p rutis-loader --features swift --test plugin_values swift
      # runtimes.swift in rutis-host (rows, restart, check), and the plugin
      # author's loop: new --lang swift, swift test, check, dev rebuilding;
      # apps hosting plugins with RutisApp (an executable standing in for one).
      # Tests that need system permission prompts (tcc, the Android emulator,
      # the iOS simulator) are run locally, not here (docs/ci.md §12).
      - name: cargo test (rutis-host with Swift, the Swift development loop)
        env:
          RUTIS_E2E_DIR: /tmp/rutis-e2e
        run: |
          cargo test -p rutis-host --test swift --test swift_app
          cargo test -p rutis-e2e --test dev_loop the_swift_plugin_development_loop
      # The events conformance with X a Swift plugin, in the placements a
      # pull request runs (written; full runs sample more).
      - name: cargo test (events conformance, X Swift)
        env:
          RUTIS_EVENTS_REQUIRE: swift
          RUTIS_EVENTS_PLACEMENTS: ${{ needs.changes.outputs.all == 'true' && 'sampled' || 'written' }}
        run: cargo test -p rutis-loader --features node,python,swift --test events_conformance events_with_x_a_swift_plugin
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The Bun runtime: its own tests, and the Rust tests that run it, on the
  # oldest Bun it supports (package.json engines.bun); also on loopback
  # channels, as processes start on Windows (no Bun job runs on Windows).
  # Pull requests: the oldest Bun on Linux; full runs add the latest on Linux
  # and the oldest on macOS (`bun-matrix`); network-macos runs the latest.
  runtimes-bun:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.bun-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        if: runner.environment == 'github-hosted' || runner.os != 'macOS'
        with:
          bun-version: ${{ matrix.bun }}
      # setup-bun installs into ~/.bun/bin, which the runner instances of a
      # self-hosted Mac share (one user's home) and network-macos fills with
      # the latest Bun at the same time: there it gets a home of its own in
      # this job's temporary directory, and no cache.
      - uses: oven-sh/setup-bun@v2
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        env:
          HOME: ${{ runner.temp }}/bun-home
        with:
          bun-version: ${{ matrix.bun }}
          no-cache: true
      # Node and Python for the rows that use Bun's services and back.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix node/rutis-runtime ci
      # setup-python's macOS builds install only under /Users/runner (the
      # hosted image's user): the self-hosted Macs take uv's Python 3.12, in
      # a virtual environment (as js-py).
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted' || runner.os != 'macOS'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      - name: Python 3.12 (self-hosted macOS)
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          uv python install 3.12
          uv venv --seed --python-preference only-managed --python 3.12 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: bun --version
      - run: bun test
        working-directory: bun/rutis-bun
      - name: cargo test (rutis-bridge, the Bun runtime and its channel)
        run: cargo test -p rutis-bridge --features bun,testing --test bun_runtime --test bun_channel --test host_gone
      # Only the Bun tests of the contract suites: the other runtimes run
      # in their own jobs.
      - name: cargo test (rutis-bridge, the contract suites with Bun)
        run: cargo test -p rutis-bridge --features bun,testing,websocket --test runtime_conformance --test session_matrix --test dial_conformance bun
      - name: cargo test (rutis-bridge, the runtime contract with Bun on loopback channels)
        env:
          RUTIS_LOCAL_HANDOVER: loopback
        run: cargo test -p rutis-bridge --features bun,testing,websocket --test session_matrix bun
      - name: cargo test (rutis-loader, Bun rows)
        run: cargo test -p rutis-loader --features bun,node,python --test bun_rows --test bun_instances --test bun_multilang --test caller_rows
      # A listening Bun runtime's leases (the other languages run in `rust`).
      - name: cargo test (rutis-loader, remote Bun runtime leases)
        run: cargo test -p rutis-loader --features bun,node,python --test leases bun
      - name: cargo test (rutis-loader, Bun rows on loopback channels)
        env:
          RUTIS_LOCAL_HANDOVER: loopback
        run: cargo test -p rutis-loader --features bun,node,python --test bun_rows --test bun_instances --test bun_multilang
      - name: cargo test (rutis-host, Bun)
        run: cargo test -p rutis-host bun
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The network stack and the runtimes on macOS: starting processes on an
  # inherited socket, Unix sockets, WebSocket links, the Node, Python, Bun and
  # Go runtimes (latest versions), rutis-host; and the static build of the
  # whole workspace. The one macOS job of an ordinary change (Q12.6.2).
  # Pull requests skip the tests that do not depend on the platform
  # (PURE_TESTS_*, top of this file); full runs run the whole suites.
  network-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # GitHub's macOS for now: on the self-hosted runners the Node processes
    # of rpc_callbacks are SIGKILLed at launch (#287). The repository
    # variable NETWORK_MACOS_RUNNER (JSON) switches it, e.g. to
    # ["self-hosted","macOS","ARM64"]; the steps below work on both
    # (docs/ci.md §10).
    runs-on: ${{ fromJSON(vars.NETWORK_MACOS_RUNNER || '"macos-15"') }}
    env:
      # The end-to-end scenarios' directories (as in `e2e`); on a
      # self-hosted runner, its own (tools/ci-self-hosted.sh).
      RUTIS_E2E_DIR: /tmp/rutis-e2e
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The caches of setup-node and setup-go only on hosted runners: a
      # self-hosted runner keeps its own, and restoring over it fails.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: node/rutis-runtime/package-lock.json
      # The SDK has no dependencies: `ci` only checks its lockfile.
      - run: npm --prefix node/rutis ci
      # The SDK's own tests do not depend on the platform: full runs only.
      - run: npm --prefix node/rutis test
        if: needs.changes.outputs.all == 'true'
      # The runtime's channels, handshake and WebSocket.
      - run: npm --prefix node/rutis-runtime ci
      - run: npm --prefix node/rutis-runtime test
      # setup-python's macOS builds install only under /Users/runner (the
      # hosted image's user): a self-hosted runner takes uv's latest Python,
      # in a virtual environment with pip.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.x'
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted'
      - name: Python (self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: |
          uv python install 3
          uv venv --seed --python-preference only-managed --python 3 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install "websockets>=15"
      - run: python3 -m unittest discover -s tests
        working-directory: python/rutis
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go/rutis/go.mod
      # The Kotlin SDK's jvm target, for the bridge's tests with `kotlin`.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: the Kotlin conformance jar
        working-directory: kotlin/rutis
        run: |
          # Retried: a download that fails halfway (the runners' networks)
          # should not fail the job.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --quiet :rutis-conformance:fatJar && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          echo "RUTIS_KOTLIN_JAR=$PWD/rutis-conformance/build/libs/rutis-conformance-all.jar" >> "$GITHUB_ENV"
      # events_conformance: the written placements on pull requests, the
      # sampled ones in full runs (as in `rust`).
      - name: cargo test (network stack, runtimes, host)
        env:
          ALL: ${{ needs.changes.outputs.all }}
          RUTIS_EVENTS_PLACEMENTS: ${{ needs.changes.outputs.all == 'true' && 'sampled' || 'written' }}
          RUTIS_EVENTS_REQUIRE: node,python,go,bun
        run: |
          BRIDGE_TESTS= LOADER_TESTS=
          if [ "$ALL" != true ]; then
            BRIDGE_TESTS=$(bash tools/platform-tests.sh crates/rutis-bridge $PURE_TESTS_BRIDGE $MACOS_SKIP_TESTS_BRIDGE)
            LOADER_TESTS=$(bash tools/platform-tests.sh crates/rutis-loader $PURE_TESTS_LOADER $MACOS_SKIP_TESTS_LOADER)
          fi
          cargo test -p rutis-bridge --all-features $BRIDGE_TESTS
          cargo test -p rutis-loader --features node,python,go,peer,bun $LOADER_TESTS
          cargo test -p rutis-host
      # The published Cordis plugins S6 mounts (tests/e2e/tests/cordis.rs),
      # at the lockfile's versions.
      - run: npm --prefix node/baseline ci
        if: '!cancelled()'
      # The end-to-end scenarios on the latest versions (the `e2e` job runs
      # them on the oldest).
      - name: cargo test (end-to-end scenarios)
        if: '!cancelled()'
        run: cargo test -p rutis-e2e
      # Who killed a process that ended with SIGKILL (#287): the kernel's
      # memory pressure kills and code signing rejections.
      - name: kernel kills in the system log
        if: failure()
        run: |
          /usr/bin/log show --last 20m --style compact --predicate 'process == "kernel" AND (eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS "CODE SIGNING" OR eventMessage CONTAINS[c] "kill")' | tail -n 200
      # The failed scenarios' directories, without what is not read for a
      # diagnosis and that upload-artifact would follow or fail on: links
      # into the checkout, sockets, installed packages and caches.
      - name: prune the scenario directories
        if: failure()
        run: |
          [ -d "$RUTIS_E2E_DIR" ] || exit 0
          find "$RUTIS_E2E_DIR" \( -type l -o -type s -o -type p \) -delete
          find "$RUTIS_E2E_DIR" -type d \( -name node_modules -o -name .venv -o -name .npm -o -name .uv -o -path '*/home/go' \) -prune -print |
            while IFS= read -r dir; do chmod -R u+w "$dir"; rm -rf "$dir"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-macos
          path: ${{ env.RUTIS_E2E_DIR }}
          retention-days: 14
      - name: keep workspace static builds available
        if: '!cancelled()'
        run: cargo check --workspace --all-targets
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # What a release publishes, packaged in full runs and when packaging changes
  # (Q12.1): the crates build from their packages, the npm packages pack, the
  # Python packages build.
  release-dry-run:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: node scripts/train.mjs
      # A train crate's verification build takes its train dependencies from
      # a temporary registry, and cargo fingerprints a registry package by its
      # version alone: a kept target directory (self-hosted, docs/ci.md §10;
      # rust-cache) would reuse a dependency built from an earlier tarball of
      # the same version, so a change to one crate's API would not reach the
      # others' verification (macos-4 failed on `rutis_loader::PLUGIN_API`
      # this way). So the train crates' own artifacts go first: `cargo clean
      # -p` removes every build of a crate, the registry copy included.
      # Cargo also unpacks each tarball of that registry into
      # $CARGO_HOME/registry/src/-<hash>/<crate>-<version> and, finding the
      # directory there, never unpacks a newer tarball of the same version:
      # the verification then built a train crate from an earlier run's
      # source (rutis-host against a rutis-loader without
      # `Supply::Announced`). Those directories (named `-<hash>`, unlike the
      # registries' own) go too.
      - name: cargo package
        run: |
          crates=$(node scripts/train.mjs --crates | sed 's/[^ ]*/-p &/g')
          rm -rf "${CARGO_HOME:-$HOME/.cargo}"/registry/src/-*
          cargo clean $crates
          cargo package --locked $crates
      - name: npm pack
        run: |
          for package in node/rutis node/rutis-runtime bun/rutis-bun node/rutis-host; do
            (cd "$package" && npm pack --dry-run)
          done
      - name: Python packages
        run: |
          uv build python/rutis --out-dir dist
          uvx maturin build --release --manifest-path crates/rutis-host/Cargo.toml --out dist
          ls dist
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # 列车里已发布的 crate 相对 crates.io 最新版的公开 API 变化：发现破坏性变更
  # 时给出警告，并在 job 摘要中列出，提示发布时需要提升的版本；不使 CI 失败
  # （0.x 允许在 minor 版本中破坏）。真正的拦截在 release.yml：版本号不允许的
  # 破坏性变更会使发布失败。
  # In full runs and when packaging changes: it only warns, and what it reports
  # matters when the train is released (Q12.1).
  semver-rutis:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash tools/ci-self-hosted.sh start
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: Report API changes since the latest release
        run: |
          # rutis-host has no library, so no API to compare.
          for crate in rutis rutis-bridge rutis-loader; do
            if cargo semver-checks -p "$crate" > semver.txt 2>&1; then
              echo "No breaking change in $crate since its latest release." >> "$GITHUB_STEP_SUMMARY"
            elif ! grep -q 'semver requires new' semver.txt; then
              # The tool itself failed (e.g. the baseline could not be built).
              cat semver.txt
              exit 1
            else
              echo "::warning title=$crate semver::Breaking API changes since the latest crates.io release; the next train release must bump the minor version (0.x). See the job summary."
              { echo "### Breaking changes in $crate since its latest release"; echo; echo '```'; perl -pe 's/\e\[[0-9;]*m//g' semver.txt | grep -vE '^[[:space:]]+(Building|Built|Parsing|Parsed|Checking|Checked|Compiling|Downloaded|Updating)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The dylib checks on Linux, in three parallel jobs to shorten the critical
  # path (Q12.6.1). Each script builds what it needs.
  dylib-linux-launcher:
    needs: changes
    if: needs.changes.outputs.dylib == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
          RUTIS_CI_FRESH_TARGET: '1'
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap and pre-dlopen rejection
        run: bash tools/test-dylib.sh
      - name: launcher pre-execution verification
        run: bash tools/test-dylib-launcher.sh
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The single-runner reproducibility check (two source and target paths on
  # one runner); the two-runner comparison runs in full runs (sdk-repro).
  dylib-linux-repro:
    needs: changes
    if: needs.changes.outputs.repro == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
          RUTIS_CI_FRESH_TARGET: '1'
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The script builds offline from copies of the source.
      - run: cargo fetch --locked
      - name: reproducible SDK across source and target paths
        run: bash tools/test-dylib-repro.sh
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  dylib-linux-sdk-bundle:
    needs: changes
    if: needs.changes.outputs.dylib == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
          RUTIS_CI_FRESH_TARGET: '1'
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: external plugin build against a prebuilt SDK
        run: bash tools/test-sdk-bundle.sh
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # On macOS the same checks stay in one job: macOS runners are scarce, and a
  # dylib change takes this second one (Q12.6.2).
  dylib-macos:
    needs: changes
    if: needs.changes.outputs.dylib == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
          RUTIS_CI_FRESH_TARGET: '1'
        run: bash tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: plugin file checks
        run: cargo test -p rutis-dylib-meta
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap, pre-dlopen rejection, quarantine and hardened host
        run: bash tools/test-dylib.sh
      # One runtime bundle for the launcher and the external plugin checks,
      # which only read it.
      - name: the runtime bundle
        id: bundle
        run: echo "dir=$(bash tools/build-dylib-bundle.sh "$RUNNER_TEMP/bundle" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: launcher pre-execution verification
        run: bash tools/test-dylib-launcher.sh "${{ steps.bundle.outputs.dir }}"
      - name: reproducible SDK across source and target paths
        if: needs.changes.outputs.repro == 'true'
        run: bash tools/test-dylib-repro.sh
      - name: external plugin build against a prebuilt SDK
        run: bash tools/test-sdk-bundle.sh "${{ steps.bundle.outputs.dir }}"
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The runtimes on Windows: Node, Python and Go processes on loopback
  # channels, rows of every language, peers and WebSocket links; and the
  # static build of the whole workspace. Pull requests skip the tests
  # that do not depend on the platform (PURE_TESTS_*, top of this file);
  # they run, among others, the runtime rows on loopback channels, which
  # full runs also rerun on Linux; full runs run the whole suites.
  runtimes-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The repository variable WINDOWS_RUNNER (JSON) switches it to the
    # organization's self-hosted Windows runners (docs/ci.md §11).
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-2025"') }}
    defaults:
      run:
        # Git's bash (on PATH, self-hosted too: docs/ci.md §11).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Several runner instances share the machine: each keeps its own
      # target and scenario directories (outside the checkout, which
      # `checkout` cleans), and takes its share of the CPUs
      # (WINDOWS_CI_JOBS overrides it).
      - name: self-hosted runner, start
        if: runner.environment == 'self-hosted'
        env:
          JOBS: ${{ vars.WINDOWS_CI_JOBS }}
        run: |
          dir="$(cygpath -m "$RUNNER_WORKSPACE/..")/_rutis-ci"
          rm -rf "$dir/e2e"
          mkdir -p "$dir/target" "$dir/e2e"
          jobs=${JOBS:-$((NUMBER_OF_PROCESSORS / 4))}
          [ "$jobs" -ge 2 ] || jobs=2
          echo "$NUMBER_OF_PROCESSORS CPUs: $jobs jobs and test threads; $dir"
          {
            echo "CARGO_TARGET_DIR=$dir/target"
            echo "RUTIS_E2E_DIR=$dir/e2e"
            echo "CARGO_BUILD_JOBS=$jobs"
            echo "RUST_TEST_THREADS=$jobs"
            echo "GOCACHE=$dir/go-build"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.98.1
      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm --prefix node/rutis-runtime ci
      # setup-python's Windows installer needs an administrator, which the
      # self-hosted runners are not: they take the machine's Python, in a
      # virtual environment with pip.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.x'
      - name: Python in a virtual environment (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          cygpath -w "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
      - run: python -m pip install "websockets>=15"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go/rutis/go.mod
      - name: go test (the Go SDK)
        run: go test ./...
        working-directory: go/rutis
      # The Kotlin SDK's jvm target, for the bridge's tests with `kotlin`
      # (loopback channels only on Windows).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: the Kotlin conformance jar
        working-directory: kotlin/rutis
        run: |
          # Retried: a download that fails halfway (the runners' networks)
          # should not fail the job.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --quiet :rutis-conformance:fatJar && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          echo "RUTIS_KOTLIN_JAR=$(cygpath -w "$PWD/rutis-conformance/build/libs/rutis-conformance-all.jar")" >> "$GITHUB_ENV"
      # events_conformance: the written placements (the runtimes are
      # started through a Node script, Windows having no sh).
      - name: cargo test (rutis-loader, every row kind)
        env:
          ALL: ${{ needs.changes.outputs.all }}
          RUTIS_EVENTS_PLACEMENTS: written
          RUTIS_EVENTS_REQUIRE: node,python,go
          RUTIS_EVENTS_SETTLE_SCALE: '2'
        run: |
          LOADER_TESTS=
          if [ "$ALL" != true ]; then
            LOADER_TESTS=$(bash tools/platform-tests.sh crates/rutis-loader $PURE_TESTS_LOADER $WINDOWS_SKIP_TESTS_LOADER)
          fi
          cargo test -p rutis-loader --features node,python,go,peer --no-fail-fast $LOADER_TESTS
      - name: cargo test (rutis-bridge, all features)
        if: '!cancelled()'
        env:
          ALL: ${{ needs.changes.outputs.all }}
        run: |
          BRIDGE_TESTS=
          if [ "$ALL" != true ]; then
            BRIDGE_TESTS=$(bash tools/platform-tests.sh crates/rutis-bridge $PURE_TESTS_BRIDGE $WINDOWS_SKIP_TESTS_BRIDGE)
          fi
          cargo test -p rutis-bridge --all-features --no-fail-fast $BRIDGE_TESTS
      - name: cargo test (rutis-host)
        if: '!cancelled()'
        run: cargo test -p rutis-host --no-fail-fast
      # The E2E harness on Windows (#232): each host in a Job Object,
      # Ctrl-Break, the residue checks; the scenarios not limited to Unix.
      # The published Cordis plugins S6 mounts (tests/e2e/tests/cordis.rs),
      # at the lockfile's versions.
      - run: npm --prefix node/baseline ci
        if: '!cancelled()'
      - name: cargo test (rutis-e2e)
        if: '!cancelled()'
        run: cargo test -p rutis-e2e --no-fail-fast
      - name: keep workspace static builds available
        if: '!cancelled()'
        run: cargo check --workspace --all-targets
      # After a failure, this instance's Go build cache goes (a job cut
      # short can leave it truncated, #374; tools/ci-self-hosted.sh does the
      # same on the other self-hosted runners).
      - name: self-hosted runner, end
        if: failure() && runner.environment == 'self-hosted'
        run: rm -rf "$GOCACHE"

  # Builds of the SDK on two separate runners compared by hash. The SDK
  # cannot come from a cache, so this stays off pull requests (Q12.6.3) and
  # runs in full runs and for changes that run everything; the dylib jobs keep the
  # single-runner check for dylib changes.
  sdk-repro:
    needs: changes
    if: needs.changes.outputs.sdk_repro == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    strategy:
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-${{ matrix.slot }}
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash source-${{ matrix.slot }}/tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: build SDK at independent paths
        working-directory: source-${{ matrix.slot }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ matrix.slot }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-${{ matrix.slot }}
        run: |
          mkdir -p "$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$CARGO_TARGET_DIR=/target"
          export RUTIS_SDK_LOCKFILE="$PWD/Cargo.lock"
          # Build the SDK through the host anchor, as tools/build-dylib-bundle.sh does.
          export RUTIS_SDK_ARTIFACT_SHA256="$(printf '0%.0s' {1..64})"
          # rustup's own cargo and rustc, not a build cache's shim on PATH
          # (mbx on the self-hosted Linux runners): a cache keeps its own
          # target directory and replays objects built with other paths or
          # flags, so the two slots would no longer differ only by the paths
          # remapped above.
          export RUSTC="$(rustup which rustc)"
          "$(rustup which cargo)" build --release --locked -p rutis-cli --features dylib-plugins
          sdk_file="$CARGO_TARGET_DIR/release/librutis_sdk.so"
          if ! readelf -d "$sdk_file" | grep -Eq 'NEEDED.*\[libstd-[^]]*\.so\]'; then
            readelf -d "$sdk_file"
            echo "SDK does not depend on the dynamic libstd" >&2
            exit 1
          fi
          sha256sum "$sdk_file" | cut -d ' ' -f 1 > "$RUNNER_TEMP/sdk.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-hash-${{ matrix.slot }}
          path: ${{ runner.temp }}/sdk.sha
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        run: bash source-${{ matrix.slot }}/tools/ci-self-hosted.sh end

  # Same as sdk-repro, on two macOS runners (self-hosted: two runner
  # instances, or one twice; the paths differ by slot either way). Builds in
  # runner.temp, which the runner empties.
  sdk-repro-macos:
    needs: changes
    if: needs.changes.outputs.sdk_repro == 'true'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    strategy:
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-${{ matrix.slot }}
      # Its limits on parallel builds (the build's own directories are in
      # runner.temp, set below).
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ vars.RUTIS_CI_JOBS }}
        run: bash source-${{ matrix.slot }}/tools/ci-self-hosted.sh start
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: build SDK at independent paths
        working-directory: source-${{ matrix.slot }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ matrix.slot }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-${{ matrix.slot }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          mkdir -p "$CARGO_HOME"
          # Xcode, or on a self-hosted runner perhaps only its command line tools.
          xcodebuild -version 2>/dev/null || pkgutil --pkg-info=com.apple.pkg.CLTools_Executables
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$CARGO_TARGET_DIR=/target"
          export RUTIS_SDK_LOCKFILE="$PWD/Cargo.lock"
          export RUTIS_SDK_ARTIFACT_SHA256="$(printf '0%.0s' {1..64})"
          # rustup's own cargo, not a build cache's shim on PATH (mbx on the
          # self-hosted Mac, docs/ci.md §10): the cache keeps its own target
          # directory, and the two builds would no longer differ only by the
          # paths remapped above. RUSTC: the same toolchain's rustc, also for
          # build scripts run outside this checkout (out of reach of its
          # rust-toolchain.toml, rustup's proxy would take its default).
          export RUSTC="$(rustup which rustc)"
          "$(rustup which cargo)" build --release --locked -p rutis-cli --features dylib-plugins
          sdk_file="$CARGO_TARGET_DIR/release/librutis_sdk.dylib"
          if ! otool -L "$sdk_file" | grep -Eq '@rpath/libstd-[^ ]*\.dylib'; then
            otool -L "$sdk_file"
            echo "SDK does not depend on the dynamic libstd" >&2
            exit 1
          fi
          shasum -a 256 "$sdk_file" | cut -d ' ' -f 1 > "$RUNNER_TEMP/sdk.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-hash-macos-${{ matrix.slot }}
          path: ${{ runner.temp }}/sdk.sha
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        run: bash source-${{ matrix.slot }}/tools/ci-self-hosted.sh end

  sdk-repro-macos-compare:
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    needs: [changes, sdk-repro-macos]
    if: needs.changes.outputs.sdk_repro == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-hash-macos-*
          path: ${{ runner.temp }}/hashes
      - run: cmp "$RUNNER_TEMP"/hashes/sdk-hash-macos-a/sdk.sha "$RUNNER_TEMP"/hashes/sdk-hash-macos-b/sdk.sha

  # The comparisons run where a runner is free (runner.temp: a self-hosted
  # runner keeps its workspace).
  sdk-repro-compare:
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    needs: [changes, sdk-repro]
    if: needs.changes.outputs.sdk_repro == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-hash-[ab]
          path: ${{ runner.temp }}/hashes
      - run: cmp "$RUNNER_TEMP"/hashes/sdk-hash-a/sdk.sha "$RUNNER_TEMP"/hashes/sdk-hash-b/sdk.sha

  # The TLA+ design models (specs/, quality standard §11.2): TLC runs every
  # configuration of a model and compares each outcome with its
  # expected.txt (run.sh). One job per model, in parallel. Pull requests that
  # change specs/**; full runs (nightly, release gate).
  specs:
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    strategy:
      fail-fast: false
      matrix:
        spec: [cross-runtime-sync, remote-lease]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: self-hosted runner, start (tools/ci-self-hosted.sh)
        if: runner.environment == 'self-hosted'
        env:
          RUTIS_CI_JOBS: ${{ runner.os == 'Linux' && vars.LINUX_CI_JOBS || vars.RUTIS_CI_JOBS }}
          RUTIS_TEST_TIME_SCALE: ${{ runner.os == 'Linux' && (vars.LINUX_TEST_TIME_SCALE || '3') || '' }}
        run: bash tools/ci-self-hosted.sh start
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The version the models' READMEs pin, checked against its digest.
      - name: tla2tools.jar v1.7.4
        run: |
          curl -sSfLo "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum -c -
      - name: TLC, specs/${{ matrix.spec }}
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          TLC_OUT: ${{ runner.temp }}/tlc
        run: bash "specs/${{ matrix.spec }}/run.sh"
      # The logs hold the counterexamples.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tlc-${{ matrix.spec }}
          path: ${{ runner.temp }}/tlc/*.log
          retention-days: 14
      - name: self-hosted runner, end
        if: always() && runner.environment == 'self-hosted'
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci-self-hosted.sh end

  # The one check a merge waits for (Q12.5): it always runs, fails when a
  # selected job failed or was cancelled, and counts jobs the change did not
  # select (skipped) as passing.
  ci-ok:
    if: always()
    needs:
      - changes
      - links
      - rust
      - e2e
      - js-py
      - lint
      - public-api
      - msrv
      - checks
      - network-macos
      - runtimes-bun
      - release-dry-run
      - semver-rutis
      - dylib-linux-launcher
      - dylib-linux-repro
      - dylib-linux-sdk-bundle
      - dylib-macos
      - runtimes-windows
      - runtimes-go
      - runtimes-kotlin
      - runtimes-swift
      - sdk-repro
      - sdk-repro-macos
      - sdk-repro-compare
      - sdk-repro-macos-compare
      - specs
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - name: every selected job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' > /dev/null; then
            echo "a selected job failed or was cancelled" >&2
            exit 1
          fi
