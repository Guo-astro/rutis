# What a release publishes, built once (Q12.7): release.yml calls this, and
# so does install.yml for main, so the packages the install scenarios test
# are made the way released ones are. It uploads:
#
#   binary-<platform>  dist/: the release archive and its .sha256;
#                      npm-bin/: the binary for the platform package
#   wheels-<target>    the rutis-host wheel of one target
#   packages           npm/: every npm tarball (@arcships/rutis, -runtime,
#                      -bun, -host, -host-<platform> of the platforms built);
#                      wheels/: the rutis wheel and sdist
name: package

on:
  workflow_call:
    inputs:
      version:
        description: The release train version (scripts/train.mjs)
        type: string
        required: true
      platforms:
        description: The npm platforms to build, as a JSON list (linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64)
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      binaries: ${{ steps.plan.outputs.binaries }}
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const wanted = JSON.parse(process.env.PLATFORMS)
          const binaries = [
            { os: 'ubuntu-24.04', target: 'x86_64-unknown-linux-musl', container: 'messense/rust-musl-cross:x86_64-musl', npm: 'linux-x64' },
            { os: 'ubuntu-24.04', target: 'aarch64-unknown-linux-musl', container: 'messense/rust-musl-cross:aarch64-musl', npm: 'linux-arm64' },
            { os: 'macos-14', target: 'x86_64-apple-darwin', npm: 'darwin-x64' },
            { os: 'macos-14', target: 'aarch64-apple-darwin', npm: 'darwin-arm64' },
            { os: 'windows-2025', target: 'x86_64-pc-windows-msvc', npm: 'win32-x64', exe: '.exe' },
          ]
          // ring's assembly needs __ARM_ARCH, which the GCC of the default
          // (manylinux2014) aarch64 cross image does not define.
          const wheels = [
            { os: 'ubuntu-24.04', target: 'x86_64', manylinux: 'auto', npm: 'linux-x64' },
            { os: 'ubuntu-24.04', target: 'aarch64', manylinux: '2_28', npm: 'linux-arm64' },
            { os: 'macos-14', target: 'x86_64-apple-darwin', npm: 'darwin-x64' },
            { os: 'macos-14', target: 'aarch64-apple-darwin', npm: 'darwin-arm64' },
            { os: 'windows-2025', target: 'x86_64-pc-windows-msvc', npm: 'win32-x64' },
          ]
          const unknown = wanted.filter(p => !binaries.some(b => b.npm === p))
          if (unknown.length) throw new Error(`unknown platforms: ${unknown}`)
          const pick = list => JSON.stringify(list.filter(item => wanted.includes(item.npm)))
          console.log(`binaries=${pick(binaries)}`)
          console.log(`wheels=${pick(wheels)}`)
          EOF

  binaries:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.binaries) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        if: matrix.container == ''
        with:
          targets: ${{ matrix.target }}
      - name: add the target (container)
        if: matrix.container != ''
        run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p rutis-host --target ${{ matrix.target }}
      - name: stage
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          NAME="rutis-host-${VERSION}-${{ matrix.target }}"
          mkdir -p "stage/${NAME}" dist
          BINARY="rutis-host${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/${BINARY}" "stage/${NAME}/"
          cp crates/rutis-host/README.md LICENSE "stage/${NAME}/"
          # A .zip on Windows, where it opens without extra tools.
          if [[ -n "${{ matrix.exe }}" ]]; then
            ARCHIVE="${NAME}.zip"
            (cd stage && 7z a -tzip "../dist/${ARCHIVE}" "${NAME}" >/dev/null)
          else
            ARCHIVE="${NAME}.tar.gz"
            tar -C stage -czf "dist/${ARCHIVE}" "${NAME}"
          fi
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" 2>/dev/null || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
          mkdir -p npm-bin && cp "target/${{ matrix.target }}/release/${BINARY}" "npm-bin/${BINARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.npm }}
          path: |
            dist/
            npm-bin/

  wheels:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wheels) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --manifest-path crates/rutis-host/Cargo.toml --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/

  # The npm tarballs and the rutis Python package. The platform packages are
  # made from the binaries above, as published.
  packages:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
      - name: npm tarballs
        run: |
          mkdir -p out/npm
          for dir in binary-*; do
            platform="${dir#binary-}"
            binary=$(ls "$dir"/npm-bin/rutis-host*)
            node node/rutis-host/scripts/platform-package.mjs "${platform%-*}" "${platform##*-}" "$binary" "platform/$platform"
            (cd "platform/$platform" && npm pack --pack-destination ../../out/npm)
          done
          for package in node/rutis node/rutis-runtime bun/rutis-bun node/rutis-host; do
            (cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/out/npm")
          done
          ls out/npm
      - name: the rutis Python package
        run: uv build python/rutis --out-dir out/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/
