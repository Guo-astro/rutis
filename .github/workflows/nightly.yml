# The nightly run (docs/ci.md §2, Q12.3, Q12.4): every job of ci.yml, the
# install checks on every platform with this commit's packages
# (install.yml), the Windows dylib tests (dylib-windows.yml), the stress
# tests (stress.yml), and the Cordis checks on the newest published Cordis
# plugins (`cordis-latest`, report only), on main's latest commit. A merge to main runs nothing,
# so this run is what checks every commit merged since the last successful
# nightly run: the paths a pull request skipped, and pull requests that pass
# alone but fail together.
#
# It runs only when main has commits the last successful nightly run did
# not check (force=true runs it anyway). A failure opens an issue (label
# `ci`, assigned to the maintainer) with the failed jobs and the commits
# checked, or comments on the one still open.
#
# By hand: Actions → nightly → Run workflow, or
# `gh workflow run nightly.yml -f force=true`.
name: nightly

on:
  schedule:
    # 03:00 in Beijing.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when main has no new commits since the last successful nightly run
        type: boolean
        default: false

permissions:
  contents: read

# One nightly run at a time per branch; a run in progress is never cancelled.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether there is anything new: this commit against the last successful
  # nightly run's.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          FORCE: ${{ inputs.force }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch "$BRANCH" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          run=true
          if [ "$base" = "$GITHUB_SHA" ] && [ "$FORCE" != true ]; then run=false; fi
          {
            echo "base=$base"
            echo "run=$run"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          if [ "$run" = false ]; then
            echo "The last successful nightly run already checked $GITHUB_SHA: nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    # ci.yml's `changes` job reads pull requests.
    permissions:
      contents: read
      pull-requests: read
    with:
      all: true
      base: ${{ needs.plan.outputs.base }}

  # This commit's packages, built and installed on every platform; GitHub's
  # clean machines but darwin-arm64 (docs/ci.md §10).
  install:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/install.yml
    with:
      source: local
      platforms: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]'
      self-hosted: true

  dylib-windows:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/dylib-windows.yml

  stress:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/stress.yml

  # Risk F4 (docs/quality-status.md, Q6.14.4): the newest published Cordis
  # and dsh plugins, instead of node/baseline's lockfile, through the checks
  # that use them: the library mount against native Cordis (rutis-bridge's
  # dsh_baseline), the generated bindings (examples/dsh-baseline, without
  # its version pins) and S6 (tests/e2e/tests/cordis.rs). Report only: a new
  # upstream release must not fail main's nightly run, so the job never
  # fails (`continue-on-error`), `report` does not wait for it and nothing
  # is opened; its summary lists the versions and each check's result, and
  # a check that failed shows as a warning on the run. Nothing is committed:
  # the lockfile stays as it is.
  cordis-latest:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm --prefix node/rutis-runtime ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install "websockets>=15"
      # The newest of each package's `latest` and `next` dist-tags
      # (node/baseline/latest.mjs). Releases that do not install together
      # (peer dependencies) are reported, then installed without the peer
      # check so the checks still run on them.
      - name: the newest published plugins
        id: newest
        run: |
          node node/baseline/latest.mjs > "$RUNNER_TEMP/versions.md"
          cat "$RUNNER_TEMP/versions.md"
          rm -rf node/baseline/node_modules node/baseline/package-lock.json
          if npm --prefix node/baseline install --no-package-lock > "$RUNNER_TEMP/install.log" 2>&1; then
            echo "install=together" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/install.log"
            echo "install=conflict" >> "$GITHUB_OUTPUT"
            npm --prefix node/baseline install --no-package-lock --legacy-peer-deps
          fi
      - name: library mount against native Cordis (dsh_baseline)
        id: baseline
        continue-on-error: true
        run: cargo test -p rutis-bridge --test dsh_baseline
      - name: generated bindings (examples/dsh-baseline)
        id: bindings
        continue-on-error: true
        # The mounts' `version` pins name the lockfile's versions; a newer
        # one would fail the build by design. Dropped here, in this checkout.
        run: |
          awk '/^\[/ { mounts = /^\[package\.metadata\.rutis-cordis\.mounts\./ } !(mounts && /^version = /)' \
            examples/dsh-baseline/Cargo.toml > "$RUNNER_TEMP/Cargo.toml"
          cp "$RUNNER_TEMP/Cargo.toml" examples/dsh-baseline/Cargo.toml
          cargo test -p dsh-baseline
      - name: S6 (tests/e2e/tests/cordis.rs)
        id: s6
        continue-on-error: true
        env:
          RUTIS_E2E_DIR: /tmp/rutis-e2e
        run: cargo test -p rutis-e2e --test cordis
      - name: report
        if: always()
        env:
          INSTALL: ${{ steps.newest.outputs.install }}
          BASELINE: ${{ steps.baseline.outcome }}
          BINDINGS: ${{ steps.bindings.outcome }}
          S6: ${{ steps.s6.outcome }}
        run: |
          {
            echo "### Newest published Cordis plugins (F4, report only)"
            echo
            cat "$RUNNER_TEMP/versions.md" 2>/dev/null || echo "(the versions could not be read)"
            echo
            case "$INSTALL" in
              together) echo "The newest versions install together." ;;
              conflict) echo "The newest versions do not install together (peer dependencies; the install log is in the step's output): installed with \`--legacy-peer-deps\`." ;;
              *) echo "The newest versions could not be installed." ;;
            esac
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| library mount against native Cordis (dsh_baseline) | ${BASELINE:-skipped} |"
            echo "| generated bindings (examples/dsh-baseline) | ${BINDINGS:-skipped} |"
            echo "| S6 (tests/e2e/tests/cordis.rs) | ${S6:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$INSTALL" = together ] || echo "::warning::the newest published Cordis plugins do not install together (F4)"
          for check in "dsh_baseline:$BASELINE" "examples/dsh-baseline:$BINDINGS" "S6:$S6"; do
            [ "${check#*:}" = success ] || echo "::warning::${check%%:*} on the newest published Cordis plugins: ${check#*:} (F4)"
          done

  # A failure opens an issue, or comments on the nightly issue still open (as
  # release.yml's `report`).
  report:
    needs: [plan, ci, install, dylib-windows, stress]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    steps:
      - name: open an issue or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          SERVER: ${{ github.server_url }}
        run: |
          run_url="$SERVER/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Every job of this run, those of the called workflows included
          # ("ci / rust").
          failed=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))：\(.conclusion)"')
          if [ -n "$BASE" ]; then
            range="[\`${BASE:0:10}..${GITHUB_SHA:0:10}\`]($SERVER/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA)（上一次成功的每晚运行到这次）"
          else
            range="[\`${GITHUB_SHA:0:10}\`]($SERVER/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)（没有成功的每晚运行可比较）"
          fi
          {
            echo "每晚运行失败：$run_url"
            echo
            echo "提交范围：$range"
            echo
            echo "失败的任务："
            echo
            echo "${failed:-（没有找到失败的任务，见运行页面）}"
            echo
            echo "处理方式见 docs/ci.md §7。"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci --state open \
            --search 'nightly in:title' --json number,title \
            --jq '[.[] | select(.title | startswith("nightly:"))][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci --assignee eric8810 \
              --title "nightly: $(date -u +%F) 失败" --body-file "$RUNNER_TEMP/body.md"
          fi
