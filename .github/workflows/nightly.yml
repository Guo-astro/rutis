# The nightly run (docs/ci.md §2, Q12.3, Q12.4): every job of ci.yml, the
# install checks with this commit's packages (install.yml: every platform
# when the packages changed, else linux-x64 for the developer-experience
# scenarios, #690), the Windows dylib tests (dylib-windows.yml), the stress
# tests (stress.yml), the Cordis checks on the newest published Cordis
# plugins (`cordis-latest`, report only) and S5 across two containers with
# netem (netem.yml, report only), on main's latest commit. A merge to main runs nothing,
# so this run is what checks every commit merged since the last successful
# nightly run: the paths a pull request skipped, and pull requests that pass
# alone but fail together.
#
# It runs only when main has commits the last successful nightly run did
# not check (force=true runs it anyway). A failure opens an issue (label
# `ci`, assigned to the maintainer) with the failed jobs and the commits
# checked, or comments on the one still open.
#
# By hand: Actions → nightly → Run workflow, or
# `gh workflow run nightly.yml -f force=true`.
name: nightly

on:
  schedule:
    # 03:00 in Beijing.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when main has no new commits since the last successful nightly run
        type: boolean
        default: false

permissions:
  contents: read

# One nightly run at a time per branch; a run in progress is never cancelled.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether there is anything new: this commit against the last successful
  # nightly run's. What that range touches decides the checks that need not
  # run every night (#576): the packages on every platform (install; it
  # runs on linux-x64 every night), the Windows dylib tests,
  # the TLA+ specs and the two-runner SDK reproducibility. Monday's run (UTC,
  # 03:00 Tuesday in Beijing) runs all of them; the event conformance suite
  # runs a sample every night and every placement on Monday.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      base: ${{ steps.plan.outputs.base }}
      install: ${{ steps.plan.outputs.install }}
      dylib: ${{ steps.plan.outputs.dylib }}
      specs: ${{ steps.plan.outputs.specs }}
      sdk_repro: ${{ steps.plan.outputs.sdk_repro }}
      events: ${{ steps.plan.outputs.events }}
    # Only curl, jq and git, no gh: a self-hosted Linux runner that also
    # carries the label ubuntu-24.04 can take this job, and it has no gh.
    steps:
      # The whole history: the changed files come from git, not the compare
      # API (which lists at most 300).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          # The commit of the last successful nightly run on this branch.
          base=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=$BRANCH&status=success&per_page=1" |
            jq -r '.workflow_runs[0].head_sha // ""')
          run=true
          if [ "$base" = "$GITHUB_SHA" ] && [ "$FORCE" != true ]; then run=false; fi

          # Monday, the first run (no base) and a base this history does not
          # have (main rewritten) check everything.
          weekly=false
          if [ "$(date -u +%u)" = 1 ]; then weekly=true; fi
          everything=$weekly
          changed=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # What this commit changed since its common ancestor with the
            # base, as the compare API's base...head.
            changed=$(git diff --name-only "$base...$GITHUB_SHA")
          else
            everything=true
          fi

          install=false; dylib=false; specs=false; sdk_repro=false
          if [ "$everything" = true ]; then
            install=true; dylib=true; specs=true; sdk_repro=true
          else
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/*|Cargo.toml|Cargo.lock|rust-toolchain.toml)
                  install=true; dylib=true; specs=true; sdk_repro=true ;;
              esac
              case "$f" in
                scripts/train.mjs|*/pyproject.toml|*/package.json|crates/*/Cargo.toml|node/rutis-host/scripts/*)
                  install=true ;;
              esac
              case "$f" in
                crates/rutis-cli/build.rs|crates/rutis-cli/src/*|crates/rutis-cli/Cargo.toml|crates/rutis-dylib/*|crates/rutis-dylib-meta/*|crates/rutis-dylib-launcher/*|crates/rutis-sdk/*|crates/rutis-dev/*|crates/rutis-xtask/*|tools/*dylib*|tools/build-dylib-bundle.sh|tools/test-sdk-bundle.sh|tools/lib/*|tests/dylib-fixtures/*)
                  dylib=true ;;
              esac
              case "$f" in
                specs/*) specs=true ;;
              esac
              case "$f" in
                crates/rutis-sdk/*|crates/rutis-cli/build.rs|tools/test-dylib-repro.sh|tools/build-dylib-bundle.sh|tools/lib/*)
                  sdk_repro=true ;;
              esac
            done <<< "$changed"
          fi
          events=sampled
          if [ "$everything" = true ]; then events=all; fi

          {
            echo "base=$base"
            echo "run=$run"
            echo "weekly=$weekly"
            echo "install=$install"
            echo "dylib=$dylib"
            echo "specs=$specs"
            echo "sdk_repro=$sdk_repro"
            echo "events=$events"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          if [ "$run" = false ]; then
            echo "The last successful nightly run already checked $GITHUB_SHA: nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    # ci.yml's `changes` job reads pull requests.
    permissions:
      contents: read
      pull-requests: read
    with:
      all: true
      base: ${{ needs.plan.outputs.base }}
      specs: ${{ needs.plan.outputs.specs == 'true' }}
      sdk_repro: ${{ needs.plan.outputs.sdk_repro == 'true' }}

  # This commit's packages, built and installed; GitHub's clean machines but
  # darwin-arm64 (docs/ci.md §10). Every platform when this range touched
  # what they package (or on the weekly run); otherwise linux-x64 alone, for
  # the developer-experience scenarios (#690), which run every night: the
  # linux-x64 binary, the x86_64 wheel and the npm tarballs are built for
  # them, a few tens of runner minutes.
  install:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/install.yml
    with:
      source: local
      platforms: ${{ needs.plan.outputs.install == 'true' && '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64"]' || '["linux-x64"]' }}
      self-hosted: true

  dylib-windows:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.dylib == 'true'
    uses: ./.github/workflows/dylib-windows.yml

  stress:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/stress.yml
    with:
      events: ${{ needs.plan.outputs.events }}

  # Risk F4 (docs/quality-status.md, Q6.14.4): the newest published Cordis
  # and dsh plugins, instead of node/baseline's lockfile, through the checks
  # that use them: the library mount against native Cordis (rutis-bridge's
  # dsh_baseline), the generated bindings (examples/dsh-baseline, without
  # its version pins) and S6 (tests/e2e/tests/cordis.rs). Report only: a new
  # upstream release must not fail main's nightly run, so the job never
  # fails (`continue-on-error`), `report` does not wait for it and nothing
  # is opened; its summary lists the versions and each check's result, and
  # a check that failed shows as a warning on the run. Nothing is committed:
  # the lockfile stays as it is.
  cordis-latest:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm --prefix node/rutis-runtime ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install "websockets>=15"
      # The newest of each package's `latest` and `next` dist-tags
      # (node/baseline/latest.mjs). Releases that do not install together
      # (peer dependencies) are reported, then installed without the peer
      # check so the checks still run on them.
      - name: the newest published plugins
        id: newest
        run: |
          node node/baseline/latest.mjs > "$RUNNER_TEMP/versions.md"
          cat "$RUNNER_TEMP/versions.md"
          rm -rf node/baseline/node_modules node/baseline/package-lock.json
          if npm --prefix node/baseline install --no-package-lock > "$RUNNER_TEMP/install.log" 2>&1; then
            echo "install=together" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/install.log"
            echo "install=conflict" >> "$GITHUB_OUTPUT"
            npm --prefix node/baseline install --no-package-lock --legacy-peer-deps
          fi
      - name: library mount against native Cordis (dsh_baseline)
        id: baseline
        continue-on-error: true
        run: cargo test -p rutis-bridge --test dsh_baseline
      - name: generated bindings (examples/dsh-baseline)
        id: bindings
        continue-on-error: true
        # The mounts' `version` pins name the lockfile's versions; a newer
        # one would fail the build by design. Dropped here, in this checkout.
        run: |
          awk '/^\[/ { mounts = /^\[package\.metadata\.rutis-cordis\.mounts\./ } !(mounts && /^version = /)' \
            examples/dsh-baseline/Cargo.toml > "$RUNNER_TEMP/Cargo.toml"
          cp "$RUNNER_TEMP/Cargo.toml" examples/dsh-baseline/Cargo.toml
          cargo test -p dsh-baseline
      - name: S6 (tests/e2e/tests/cordis.rs)
        id: s6
        continue-on-error: true
        env:
          RUTIS_E2E_DIR: /tmp/rutis-e2e
        run: cargo test -p rutis-e2e --test cordis
      - name: report
        if: always()
        env:
          INSTALL: ${{ steps.newest.outputs.install }}
          BASELINE: ${{ steps.baseline.outcome }}
          BINDINGS: ${{ steps.bindings.outcome }}
          S6: ${{ steps.s6.outcome }}
        run: |
          {
            echo "### Newest published Cordis plugins (F4, report only)"
            echo
            cat "$RUNNER_TEMP/versions.md" 2>/dev/null || echo "(the versions could not be read)"
            echo
            case "$INSTALL" in
              together) echo "The newest versions install together." ;;
              conflict) echo "The newest versions do not install together (peer dependencies; the install log is in the step's output): installed with \`--legacy-peer-deps\`." ;;
              *) echo "The newest versions could not be installed." ;;
            esac
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| library mount against native Cordis (dsh_baseline) | ${BASELINE:-skipped} |"
            echo "| generated bindings (examples/dsh-baseline) | ${BINDINGS:-skipped} |"
            echo "| S6 (tests/e2e/tests/cordis.rs) | ${S6:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$INSTALL" = together ] || echo "::warning::the newest published Cordis plugins do not install together (F4)"
          for check in "dsh_baseline:$BASELINE" "examples/dsh-baseline:$BINDINGS" "S6:$S6"; do
            [ "${check#*:}" = success ] || echo "::warning::${check%%:*} on the newest published Cordis plugins: ${check#*:} (F4)"
          done

  # Risk E12 (docs/quality-status.md): S5 across two containers, TLS on a
  # non-loopback address, netem delay, loss and an outage (netem.yml,
  # #341). Report only, like `cordis-latest`: the job never fails the run,
  # `report` does not wait for it; a failure shows as a warning and its
  # logs are uploaded.
  netem:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/netem.yml
    with:
      report-only: true

  # A failure opens an issue, or comments on the nightly issue still open (as
  # release.yml's `report`).
  report:
    needs: [plan, ci, install, dylib-windows, stress]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    steps:
      # curl and jq, no gh, as in plan.
      - name: open an issue or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          SERVER: ${{ github.server_url }}
        run: |
          set -o pipefail
          api() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$@"
          }
          repo="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          run_url="$SERVER/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Every job of this run, those of the called workflows included
          # ("ci / rust"), but the report-only ones (`cordis-latest`,
          # `netem / …`), which never fail the run. 100 a page.
          failed=""
          page=1
          while :; do
            jobs=$(api "$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100&page=$page")
            lines=$(jq -r '.jobs[] | select(.name != "cordis-latest" and (.name | startswith("netem / ") | not)) | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))：\(.conclusion)"' <<< "$jobs")
            failed="$failed$lines"$'\n'
            [ "$(jq '.jobs | length' <<< "$jobs")" -lt 100 ] && break
            page=$((page + 1))
          done
          failed=$(sed '/^$/d' <<< "$failed")
          if [ -n "$BASE" ]; then
            range="[\`${BASE:0:10}..${GITHUB_SHA:0:10}\`]($SERVER/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA)（上一次成功的每晚运行到这次）"
          else
            range="[\`${GITHUB_SHA:0:10}\`]($SERVER/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)（没有成功的每晚运行可比较）"
          fi
          {
            echo "每晚运行失败：$run_url"
            echo
            echo "提交范围：$range"
            echo
            echo "失败的任务："
            echo
            echo "${failed:-（没有找到失败的任务，见运行页面）}"
            echo
            echo "处理方式见 docs/ci.md §7。"
          } > "$RUNNER_TEMP/body.md"
          # The open issue labelled ci whose title starts with "nightly:"
          # (the issues API lists pull requests too: left out).
          number=$(api "$repo/issues?labels=ci&state=open&per_page=100" |
            jq -r '[.[] | select(.pull_request == null and (.title | startswith("nightly:")))][0].number // empty')
          if [ -n "$number" ]; then
            jq -Rs '{body: .}' "$RUNNER_TEMP/body.md" |
              api -X POST "$repo/issues/$number/comments" --data-binary @- > /dev/null
          else
            jq -Rs --arg title "nightly: $(date -u +%F) 失败" \
              '{title: $title, body: ., labels: ["ci"], assignees: ["eric8810"]}' "$RUNNER_TEMP/body.md" |
              api -X POST "$repo/issues" --data-binary @- > /dev/null
          fi
