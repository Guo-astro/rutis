[package]
name = "rutis-loader"
description = "Data-driven plugin management for rutis: layered desired state, reconcile, editable layer and persistence hook"
edition.workspace = true
version = "0.18.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cordis", "plugin", "loader", "reconcile"]
categories = ["asynchronous", "config"]

[dependencies]
rutis = { path = "../rutis", version = "0.18.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
rutis-bridge = { path = "../rutis-bridge", version = "0.18.0", optional = true, default-features = false }

[features]
# Plugins of other languages as rows, each language in its own runtime
# process, the far end of a session (`<row>:<plugin>` rows; how each
# runtime starts is the application's): what every language shares.
runtimes = ["dep:rutis-bridge"]
# The Node runtime's rows, npm names and files, as rows of the row `node`.
node = ["runtimes"]
# Go leaf plugins (`go:<plugin>` rows), one runtime per Go binary.
go = ["binary"]
# Swift leaf plugins (`swift:<plugin>` rows), one runtime per Swift binary.
swift = ["binary"]
# What compiled languages (one runtime per program: Go, Swift)
# share; enabled by their features.
binary = ["runtimes"]

[target.'cfg(unix)'.dependencies]
# Waiting for a manifest process without reaping it, so its group can still
# be killed.
libc = "0.2"

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
url = "2"
rutis-bridge = { path = "../rutis-bridge", features = ["websocket", "testing"] }
# The kernel's test hooks (events_conformance.rs waits on a dispatch's
# selection, #659).
rutis = { path = "../rutis", features = ["testing"] }
