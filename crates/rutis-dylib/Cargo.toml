[package]
name = "rutis-dylib"
description = "Optional loader for trusted rutis dylib plugins"
edition.workspace = true
version = "0.22.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

[dependencies]
rutis-sdk = { path = "../rutis-sdk", version = "0.22.0" }
rutis = { path = "../rutis", version = "0.22.0" }
rutis-dylib-meta = { path = "../rutis-dylib-meta", version = "0.22.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
semver = "1"
thiserror = { workspace = true }
tempfile = "3"
rutis-loader = { path = "../rutis-loader", version = "0.22.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[features]
# DylibResolver: dylib plugins as rutis-loader rows (`dylib:<dir>`).
loader = ["dep:rutis-loader"]
# Test hooks only: `Loader::testing` and `Backend` replace the opener and the
# symbol lookup of a load, so a test can prove that a rejected plugin never
# reaches `dlopen`.
testing = []

[dev-dependencies]
tokio = { workspace = true }
# greeter_host: a #[rutis::service] type in a plugin is served by name.
rutis-bridge = { path = "../rutis-bridge", default-features = false }
# `tests/open_seam.rs` writes plugin files and needs the identity this crate
# was built against; it builds the seam in through this dependency.
object = { version = "0.40", default-features = false, features = ["std", "read_core", "elf", "macho", "pe", "write"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rutis-dylib = { path = ".", features = ["testing"] }

[[example]]
name = "loader_host"
required-features = ["loader"]
