[package]
name = "rutis-macros"
description = "The procedural macros of rutis: #[rutis::service], which serves a Rust type's methods to the plugins of other languages"
edition.workspace = true
version = "0.13.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "plugin", "macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[dev-dependencies]
# Spans with line numbers outside the compiler, for the R5 test.
proc-macro2 = { version = "1", features = ["span-locations"] }
