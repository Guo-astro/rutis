[package]
name = "rutis-types"
description = "Generate the TypeScript declarations and Python types of Rust services marked #[rutis::service], from their Rust source, for build scripts"
# The release train.
version = "0.18.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "typescript", "python", "codegen", "build"]
categories = ["development-tools::build-utils"]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"
