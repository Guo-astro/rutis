[package]
name = "rutis"
description = "Cordis core paradigms in idiomatic Rust: plugin assembly, fiber lifecycle, typed service registry, dependency-driven reload"
edition.workspace = true
version = "0.17.1"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cordis", "plugin", "fiber", "event-bus", "async"]
categories = ["asynchronous", "concurrency"]

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What `#[rutis::service]` blocks and the bridge exchange values through.
erased-serde = "0.4"
rutis-macros = { path = "../rutis-macros", version = "0.17.1" }
# `From<rutis::Error> for anyhow::Error` and `Error::from_anyhow`.
anyhow = { version = "1.0.90", optional = true }

[features]
anyhow = ["dep:anyhow"]

# The shuttle models (src/shuttle_tests.rs, #179): built with
# `RUSTFLAGS="--cfg rutis_shuttle"` only, never by a plain build.
[target.'cfg(rutis_shuttle)'.dependencies]
shuttle = "0.9.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rutis_shuttle)"] }

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
# Paused clock (`start_paused`) for the tests that check something has not
# happened yet.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "events"
harness = false

[[bench]]
name = "runtime"
harness = false
