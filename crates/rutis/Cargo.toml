[package]
name = "rutis"
description = "Cordis core paradigms in idiomatic Rust: plugin assembly, fiber lifecycle, typed service registry, dependency-driven reload"
edition.workspace = true
version = "0.9.1"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cordis", "plugin", "fiber", "event-bus", "async"]
categories = ["asynchronous", "concurrency"]

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
# Paused clock (`start_paused`) for the tests that check something has not
# happened yet.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "events"
harness = false

[[bench]]
name = "runtime"
harness = false
