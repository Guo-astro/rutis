[package]
name = "rutis-test-support"
description = "Wait helpers shared by the rutis tests: hang guards, polling with the state on timeout, the paused-clock helpers"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Only tokio: every crate of the workspace, the kernel included, can take it
# as a dev-dependency without a cycle. Published crates list it by path only,
# which cargo publish drops.
[dependencies]
tokio = { workspace = true, features = ["time", "sync", "rt"] }
