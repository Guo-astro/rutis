[package]
name = "rutis-bridge"
description = "Connect rutis to other processes, languages and machines: plugins in Node and Python, links between rutis nodes, Cordis plugins mounted with Rust bindings"
# The release train: released together with rutis-loader, rutis-host, and the
# npm and PyPI packages, at the same version.
version = "0.19.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "plugin", "python", "node", "go"]
categories = ["development-tools::ffi", "network-programming"]

[dependencies]
rutis = { path = "../rutis", version = "0.19.0" }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float in a frame reads back as the double sent (#290).
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
# websocket
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
socket2 = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
# cordis
toml = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["node"]
# Local Node runtimes.
node = []
# Local Python runtimes.
python = []
# Local Go runtimes: binaries built with the Go SDK (go/rutis).
go = []
# Local Bun runtimes.
bun = []
# Tests only: the conformance suites with the Kotlin SDK (kotlin/rutis, its
# jvm target), started through the generic `Launcher`; no Kotlin runtime is
# configured in rutis-host (docs/design-android-runtime-2026-10-12.md K-P1).
kotlin = []
# Local Swift runtimes: binaries built with the Swift SDK (swift/rutis).
swift = []
# The WebSocket transport.
websocket = [
    "dep:futures-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:socket2",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
]
# Cordis plugins mounted with Rust bindings generated at build time.
cordis = ["node", "dep:toml"]
# The channel contract tests, and the session and runtime conformance
# suites other implementations run.
testing = []

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing` (src/fuzzing.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[example]]
name = "smoke"
required-features = ["websocket"]
