[project]
name = "{{name}}"
version = "0.1.0"
description = "A rutis plugin"
readme = "README.md"
requires-python = ">=3.12"
# A lower bound only: the plugin runs with the rutis of the host's Python
# environment (the runtime), so an upper bound would downgrade it or keep the
# host from upgrading. rutis keeps the names plugins import while the plugin
# API stays.
dependencies = ["rutis>={{version}}"]
keywords = ["rutis-plugin"]

# A host names this plugin py:{{id}}.
[project.entry-points."rutis.plugins"]
{{id}} = "{{module}}"

[dependency-groups]
dev = ["rutis-host>={{version}},<{{next}}"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{module}}"]
