name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release and its binaries

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @arcships/rutis-host@^{{version}}
      # rutistest runs the plugin under `rutis-host test`, found on PATH.
      - run: go test ./...
      - run: rutis-host check
      - name: build every platform
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            suffix=$([ "$os" = windows ] && echo .exe || true)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/{{name}}-$os-$arch$suffix" ./cmd/{{name}}
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
