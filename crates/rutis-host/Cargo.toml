[package]
name = "rutis-host"
description = "A rutis host that needs no Rust: run plugins written in TypeScript, JavaScript, Python and Go (in Node, Bun, Python or Go binaries) from a rutis.json, develop them with live reload, link machines"
# The release train.
version = "0.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "plugin", "host", "python", "go"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rutis-host"
path = "src/main.rs"

[dependencies]
rutis = { path = "../rutis", version = "0.10.0" }
rutis-bridge = { path = "../rutis-bridge", version = "0.10.0", features = ["node", "python", "bun", "go", "websocket"] }
rutis-loader = { path = "../rutis-loader", version = "0.10.0", features = ["node", "python", "bun", "go", "peer"] }
# To say which file is not PEM (the transport only sees the contents).
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { workspace = true, features = ["signal"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
tempfile = "3"
# The relay of dial_in.rs: a WebSocket client on each side.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
