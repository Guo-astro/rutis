[package]
name = "rutis-host"
description = "A rutis host that needs no Rust: run plugins written in TypeScript, JavaScript, Python, Go and Swift (in Node, Bun, Python, Go or Swift binaries) from a rutis.json, develop them with live reload, link machines"
# The release train.
version = "0.13.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "plugin", "host", "python", "go"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rutis-host"
path = "src/main.rs"

[features]
# Tests only: Kotlin runtimes connecting to the host, `runtimes.remote[]`
# with `language: "kotlin"` (the jvm target of kotlin/rutis, its
# conformance jar; `RUTIS_KOTLIN_JAR` names one built beforehand).
kotlin = []
# Tests only: kotlin/rutis/android-sample on an Android device or emulator
# (`adb`), dialing in to the host (tests/android.rs).
android = []

[dependencies]
rutis = { path = "../rutis", version = "0.13.0" }
rutis-bridge = { path = "../rutis-bridge", version = "0.13.0", features = ["node", "python", "bun", "go", "swift", "websocket", "exports"] }
rutis-loader = { path = "../rutis-loader", version = "0.13.0", features = ["node", "python", "bun", "go", "swift", "peer"] }
# To say which file is not PEM (the transport only sees the contents).
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { workspace = true, features = ["signal"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Path only: cargo publish drops it.
rutis-test-support = { path = "../rutis-test-support" }
tempfile = "3"
# The paused clock, for the configuration watch's timing.
tokio = { workspace = true, features = ["test-util"] }
